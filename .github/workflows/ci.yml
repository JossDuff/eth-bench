name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PROMPTFOO_DISABLE_TELEMETRY: "1"
  PROMPTFOO_DISABLE_UPDATE: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx promptfoo validate
      # Smoke run with promptfoo's echo provider, which returns the prompt itself.
      # No API key needed; multiple choice only, so the grader is never called.
      - run: npx promptfoo eval -r echo --filter-metadata type=multiple_choice -n 20 --no-cache --no-write --no-progress-bar
