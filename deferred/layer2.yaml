- id: l2-native-rollups-benefit
  type: open
  question: |
    What benefit would native rollups bring to Ethereum?
  answer: |
    A native rollup verifies its EVM state transitions using an L1 precompile
    (the proposed EXECUTE precompile) instead of its own fraud-proof or
    validity-proof system. That gives it Ethereum's own security with no security
    council or bespoke prover to trust, lets it upgrade automatically in step with
    L1 EVM changes with no governance, and removes most of the complexity of
    building a rollup VM. A complete answer must say native rollups reuse L1
    execution verification (a precompile) so they inherit L1 security and stay
    in sync with EVM upgrades without their own governance.
  difficulty: understanding
  source: https://ethresear.ch/t/native-rollups-superpowers-from-l1-execution/21517

- id: l2-types-and-tradeoffs
  type: open
  question: |
    What are the main types of Ethereum layer 2 designs, and what are their
    tradeoffs?
  answer: |
    Optimistic rollups post data to L1 and assume validity, relying on fraud
    proofs during a challenge window, so they are cheap and EVM-compatible but
    have long withdrawal delays. ZK (validity) rollups post data plus a validity
    proof, giving fast finality and stronger security at the cost of proving
    complexity and cost. Validiums and plasma keep data off-chain, cutting costs
    further but weakening data availability guarantees. Based rollups let L1
    proposers sequence L2 blocks, gaining L1 liveness and censorship resistance
    but giving up fast soft confirmations and sequencer revenue. Sidechains have
    their own consensus and do not inherit Ethereum security at all. A complete
    answer must describe at least optimistic and ZK rollups with their core
    tradeoff (fraud proofs and delay versus validity proofs and proving cost) and
    mention at least one other category.
  difficulty: reasoning
  source: https://vitalik.eth.limo/general/2021/01/05/rollup.html

- id: l2-rollup-stages
  type: open
  question: |
    What do "Stage 0", "Stage 1", and "Stage 2" mean when describing a rollup?
  answer: |
    They are the decentralisation stages from L2BEAT's framework. Stage 0 is
    "full training wheels": the rollup posts data to L1 but users depend on the
    operators, with no working proof system or with a security council that can
    override everything. Stage 1 has a functioning fraud or validity proof system
    so the L1 enforces state transitions, with a security council limited to
    fixing bugs (typically requiring a large supermajority) and users able to exit
    without operator cooperation. Stage 2 removes the training wheels: the proof
    system is fully in charge, the security council can only act on provable
    on-chain bugs, and upgrades have a delay long enough for users to exit. A
    complete answer must describe the progression from operator trust to a proof
    system enforced by L1 with limited or no override powers.
  difficulty: understanding
  source: https://vitalik.eth.limo/general/2025/05/06/stages.html
