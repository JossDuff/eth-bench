[project]
name = "eth-bench"
version = "0.1.0"
description = "An LLM benchmark on Ethereum knowledge, built on Inspect AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "inspect-ai>=0.3",
    "pyyaml>=6",
]

[project.entry-points.inspect_ai]
eth_bench = "eth_bench._registry"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eth_bench"]

# Ship the question files inside the installed package so the benchmark
# works after `pip install` without a checkout of this repo.
[tool.hatch.build.targets.wheel.force-include]
"questions" = "eth_bench/questions"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
