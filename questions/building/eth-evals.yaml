    answer: |-
      The response's answer must match the pattern `(anvil|evm)_setIntervalMining` (that is, it must name the concept the pattern captures). The reference answer is: Answer: anvil_setIntervalMining. Reference from ethskills: "cast rpc anvil_setIntervalMining 1 ``` Without this, `block.timestamp` stays FROZEN. Any contract logic using timestamps (deadlines, expiry, vesting) will break silently."
  metadata:
