    question: |-
      A Next.js app is statically exported (output: "export") and deployed to IPFS. The root route / loads fine, but /debug returns 404 because the build emitted debug.html instead of a directory with an index.html, and IPFS gateways only resolve directories to index.html. Which next.config.ts option (name and value) fixes this?
      End your reply with a line of the form "Answer: <option>: <value>".
    answer: |-
      The response must mention every one of these: `trailingSlash`, `\btrue\b`. The reference answer is: Answer: trailingSlash: true. Reference from ethskills: "`trailingSlash: true` (CRITICAL)** — This is the #1 reason routes break: - `trailingSlash: false` (default) → generates `debug.html` - `trailingSlash: true` → generates `debug/index.html`"
