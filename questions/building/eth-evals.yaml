- description: building/concepts-k-04
  vars:
    type: open
    question: |-
      A contract derives "randomness" as `uint(keccak256(abi.encodePacked(block.timestamp)))`. Post-Merge, the proposer cannot freely choose the timestamp (it is fixed by the slot) — yet this is still worthless as a source of randomness. Why?
      End your reply with a line of the form "Answer: <why>".
    answer: |-
      The response's answer must match the pattern `predict|known|advance|public|determin|comput|read` (that is, it must name the concept the pattern captures). The reference answer is: Answer: the timestamp is publicly predictable — anyone can compute the same value before acting. Reference from ethskills: "// ❌ Validators can manipulate block.timestamp (within ~15 seconds)" Grade INCORRECT for these tempting wrong answers: `Answer: validators manipulate the timestamp`
  metadata:
    section: building
    type: open
    difficulty: recall
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-concepts.jsonl
    tags:
