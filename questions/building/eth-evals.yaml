    choices:
      - |-
        Next.js prerenders pages in a separate build worker process where instrumentation.ts never runs, while --require injects into every Node process including workers
      - '--require is needed to transpile the TypeScript polyfill'
      - instrumentation.ts only runs in production mode, not during builds
      - instrumentation.ts runs after pages have already been rendered
    answer: A
