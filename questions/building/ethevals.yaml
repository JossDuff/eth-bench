- description: building/building-10-index-events
  vars:
    type: open
    question: |-
      We're launching the frontend for an NFT collection that's been live on Ethereum
      mainnet for about three years. The main screen is an activity feed — every mint,
      sale, and transfer in the collection, newest first — plus a "top holders" panel
      that ranks wallets by how many tokens they hold right now.

      Here's the plan our contractor wrote up, and I want a sanity check before we build on
      it:

        "On page load the client calls eth_getLogs for the collection's Transfer event
         from block 0 to latest, gets the full history back, and we compute the feed and
         the holder ranking in the browser. It's all standard RPC, so any provider key
         works and we don't need extra infrastructure."

      Ethereum is around block 25,800,000 now. Walk me through what actually happens when
      this ships: roughly how many RPC requests that one page load turns into and why (be
      concrete about the number and what forces it), what specifically breaks first in
      production, and what we should build instead so the feed and the holder panel load
      quickly. If your alternative needs infrastructure we don't have yet, say so.
    answer: |-
      Grade CORRECT only if the response satisfies every one of these points; a response that misses any of them is INCORRECT:
      - The response establishes that a single provider's eth_getLogs call cannot return the full 0-to-latest range at once: public RPC providers cap each getLogs call by block span (commonly ~2K, up to ~10K blocks) and/or by matched-result count (~10K logs), so the client is forced to paginate across the whole history. It does NOT claim one call from block 0 to latest just works.
      - It derives a concrete request/page count from a stated cap rather than answering with a vague 'a lot' or 'it's slow' — either from the block-span cap and the height stated in the input (at ~25.8M that is 25,800,000 / ~2,000 ≈ 12,900 requests) or from the ~10K matched-log response cap and an estimated log volume (e.g. a few million transfers / 10K ≈ hundreds of pages). Any figure that ties a real cap to a real volume passes; a request count with no cap behind it does not.
      - It names what breaks first in production as a consequence of that scan — provider rate limits / 429s, request timeouts, or blown compute-unit / credit budget on every page load — i.e. an O(n)-in-chain-length scan that gets worse every block, not a one-time cost.
      - The recommended fix is an indexer that has already processed the collection's history and serves it as a ready query — a subgraph (The Graph), Ponder, or a provider/NFT data API (Alchemy getNftsForContract / getAssetTransfers, etc.) — so the page load becomes one indexed query instead of a historical block scan. It explicitly acknowledges this is added infrastructure (an indexing service to run/deploy or a third-party API), not just 'paginate harder' or 'use an archive node'.
      - The 'top holders right now' panel is handled as current ownership, not as a historical scan: the ranking is derived from the indexed dataset or from current-state ownership reads (e.g. ownerOf across the collection), and it does NOT prescribe an archive node — current ownership is a current-state read, while the historical feed is what needs the indexer.
  metadata:
    section: building
    type: open
    difficulty: reasoning
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/building/building-10-index-events.yaml
    tags:
      - ethevals
      - building
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: building

- description: building/building-11-forty-balances
  vars:
    type: open
    question: |-
      We're adding a portfolio panel to our dApp. When a user connects, the panel shows
      their current balance of the 40 ERC-20 tokens we support, on Base — just the live
      numbers as of now, refreshed when they reopen the panel. No history, no charts, no
      P&L, just "what do you hold right now."

      An engineer has scoped it like this and wants to start building:

        "We'll write and deploy a subgraph that indexes Transfer events for all 40 tokens,
         track a running balance per holder in the mappings, and the panel queries the
         subgraph for the connected wallet's balances. That way the balances are always
         accurate."

      Before we commit a sprint to building and operating that subgraph, tell me whether
      it's the right tool for this panel. If it's overkill, say what the panel should do
      instead, be specific about how many onchain calls it takes to fetch all 40 balances
      for one wallet the way you'd build it, and explain how that approach stays accurate
      as balances change.
    answer: |-
      Grade CORRECT only if the response satisfies every one of these points; a response that misses any of them is INCORRECT:
      - The response concludes that building/operating a subgraph for this panel is overkill: the panel needs only current balances, and current state does not require an indexer or historical event processing. It frames indexers as the tool for historical/aggregated data, not for a live current-state read.
      - The recommended approach is direct current-state reads of balanceOf on the token contracts via RPC — no subgraph, no scanning of Transfer history.
      - It specifies that all 40 balances for one wallet come back in a single aggregated request rather than 40 separate RPC round-trips — either by batching the 40 balanceOf reads with Multicall3 (one onchain call), or via a provider balances endpoint (e.g. Alchemy getTokenBalances) that returns them in one request. It does NOT describe the correct approach as 40 individual calls or as a subgraph query. Multicall3 is the expected onchain answer; a provider balances API is equally acceptable.
      - It explains why the direct read stays correct without an indexer: balanceOf returns live current state on every call, so there is nothing to keep synced — whereas the proposed subgraph would have to reconstruct balances from Transfer history and could drift or lag from the true current value (e.g. rebasing/fee-on-transfer tokens, reorgs, indexing lag), making it both more work and less reliable for this use case.
  metadata:
    section: building
    type: open
    difficulty: reasoning
    source: |-
