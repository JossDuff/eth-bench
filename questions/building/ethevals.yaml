      A Yearn-style vault lets ANYONE call harvest() to compound accumulated rewards, paying the caller a fixed bounty of $0.40. Gas for the call reliably costs about $3. For every state transition you must ask: who pokes it, why would they, and is the incentive sufficient (covers gas + profit)? Given those questions, what happens to this vault?
    choices:
      - Bots call it anyway at a loss to keep the protocol healthy
      - Validators are required to include a harvest call once per epoch
      - The network eventually executes harvest() itself once rewards are large enough
      - |-
        Nobody calls harvest — the incentive doesn't cover gas, so the transition never happens and rewards sit uncompounded
    answer: D
