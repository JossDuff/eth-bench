      value: '{{answer}}'
      metric: building

- description: building/building-21-5792-fallback
  vars:
    type: multiple_choice
    question: |-
      Your dapp sends a batch through EIP-5792 wallet_sendCalls with the atomic capability required (approve then swap, all or nothing) and a paymasterService capability so the user pays no gas. The connected wallet returns "method not found" for wallet_sendCalls. What should your client library do?
    choices:
      - Send only the first call and let the user retry the rest
      - Retry wallet_sendCalls with the older parameter shape
      - |-
        Throw: the caller required atomic execution and a capability the wallet cannot honor; falling back would run the calls non-atomically (approve can land without the swap) and silently drop the sponsorship
      - Fall back to one eth_sendTransaction per call so the flow still works
    answer: C
