- id: concepts-19-why-slashing
  type: multiple_choice
  question: |
    Ethereum proof-of-stake requires validators to lock a deposit that can be destroyed (slashed) if they provably violate the rules, e.g. by signing two conflicting blocks. Why is a slashable bond required at all — what does it add that paying honest-behavior rewards alone cannot?
  choices:
  - It funds the block rewards paid to other validators
  - |-
    It gives misbehavior a concrete, attributable cost: with only rewards, an attacker who signs conflicting messages has nothing at stake to lose, so attacks on finality would be nearly free
  - It compensates users whose transactions get censored
  - |-
    It exists purely to limit the validator set size to keep consensus messages small
  answer: B
  difficulty: understanding
  source: |-
    https://github.com/austintgriffith/ethevals/blob/main/evals/concepts/concepts-19-why-slashing.yaml
