- id: consensus-exit-vs-slashed-withdrawability
  type: open
  question: |
    Compare how long a validator waits between its exit epoch and becoming
    withdrawable when it exits voluntarily versus when it is slashed. What
    happens partway through the slashed validator's wait?
  answer: |
    A voluntarily exited validator becomes withdrawable
    MIN_VALIDATOR_WITHDRAWABILITY_DELAY = 256 epochs (about 27 hours) after its
    exit epoch. A slashed validator's withdrawable epoch is pushed out to
    EPOCHS_PER_SLASHINGS_VECTOR = 8192 epochs (about 36 days) after slashing.
    Halfway through that period (4096 epochs) the correlation penalty is applied:
    a further loss proportional to the total balance slashed across the network
    in the surrounding 36-day window, scaled by the proportional slashing
    multiplier, so slashings that many validators suffer at once are punished
    far more heavily than an isolated one. A complete answer must give roughly
    27 hours (256 epochs) versus roughly 36 days (8192 epochs) and mention the
    correlation penalty applied during the slashed validator's wait.
  difficulty: reasoning
  source: https://github.com/ethereum/consensus-specs/blob/dev/specs/phase0/beacon-chain.md

