- id: consensus-deneb-attestation-inclusion-window
  type: open
  question: |
    How did the Deneb upgrade (EIP-7045) change how late an attestation can be
    included in a block, and why?
  answer: |
    Before Deneb an attestation could be included only within 32 slots of the
    slot it attested to. Deneb removed that rolling upper bound: an attestation
    can now be included in any block up to the end of the epoch after the one it
    was made in, as long as its target is the current or previous epoch, and
    such late attestations still earn the target reward. The change was made
    because the LMD-GHOST security analysis and the confirmation rule (fast
    block confirmation in a few slots) rely on votes from a whole epoch being
    includable through the following epoch. A complete answer must say the
    window became "through the end of the next epoch" instead of a fixed 32
    slots, and connect it to fork choice security or the confirmation rule.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-7045

