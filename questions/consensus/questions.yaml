- id: consensus-whistleblower-reward
  type: open
  question: |
    When a slashing is included in a block, who is rewarded and how is the
    reward computed after Electra?
  answer: |
    The slashed validator loses an initial penalty (effective balance divided
    by MIN_SLASHING_PENALTY_QUOTIENT_ELECTRA = 4096). Separately, a
    whistleblower reward of effective balance divided by
    WHISTLEBLOWER_REWARD_QUOTIENT_ELECTRA = 4096 is paid: the block proposer
    who includes the slashing receives PROPOSER_WEIGHT / WEIGHT_DENOMINATOR
    (8/64, one eighth) of it and the whistleblower receives the rest. In
    practice the spec sets the whistleblower to the proposer when none is
    specified, so the proposer collects the whole reward, which is why
    including slashings is profitable for proposers. A complete answer must say
    the proposer including the slashing is rewarded with a share of a
    whistleblower reward proportional to the slashed validator's effective
    balance (1/4096 after Electra), and that in practice the proposer receives
    it all.
  difficulty: understanding
  source: https://github.com/ethereum/consensus-specs/blob/dev/specs/electra/beacon-chain.md

- id: consensus-inactivity-leak-quadratic
  type: open
  question: |
    Why does a validator's balance loss during an inactivity leak grow
    quadratically with time rather than linearly?
  answer: |
    Each validator has an inactivity score. During a leak (no finality for more
    than four epochs) the score rises by INACTIVITY_SCORE_BIAS = 4 for every
    epoch the validator misses its target vote, and only falls by 1 per epoch
    when it participates (and only outside a leak). The per-epoch inactivity
    penalty is effective balance times the current inactivity score, divided
    by INACTIVITY_SCORE_BIAS times INACTIVITY_PENALTY_QUOTIENT_BELLATRIX
    (2^24). Because the per-epoch penalty is itself proportional to a score that
    grows linearly with time offline, the cumulative loss is quadratic. This
    makes sustained non-participation increasingly expensive so that stake of
    offline validators drains fast enough for the remaining validators to
    regain a two-thirds majority and finalize. A complete answer must say the
    penalty each epoch scales with an inactivity score that accumulates while
    offline, so total loss is quadratic, and mention the goal of restoring
    finality.
  difficulty: reasoning
  source: https://github.com/ethereum/consensus-specs/blob/dev/specs/altair/beacon-chain.md

