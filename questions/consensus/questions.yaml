- id: consensus-randao-bias
  type: open
  question: |
    How much influence does a block proposer have over the beacon chain's
    RANDAO output, and why is it so limited?
  answer: |
    Very little: essentially one bit per block. The proposer's randao_reveal is
    a BLS signature over the epoch number with the validator's key, so its value
    is deterministic and the proposer cannot choose it; the only choice is to
    publish the block (mixing the reveal in) or withhold it (losing the proposal
    reward and leaving the mix unchanged). A proposer controlling the last k
    consecutive slots of an epoch can therefore pick among 2^k outcomes for the
    seed that will be used one epoch later (MIN_SEED_LOOKAHEAD). A complete
    answer must say the reveal is a deterministic signature so the proposer can
    only choose whether to publish, giving about one bit of bias per block.
  difficulty: reasoning
  source: https://github.com/ethereum/consensus-specs/blob/dev/specs/phase0/beacon-chain.md

