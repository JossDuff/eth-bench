- id: consensus-electra-deposit-processing
  type: open
  question: |
    How did the Electra upgrade change the way deposits are processed on the
    beacon chain?
  answer: |
    Two changes. First, with EIP-6110 deposits are delivered in-protocol as
    execution layer requests carried in the execution payload, replacing the old
    Eth1 data voting mechanism and its long follow-distance delay. Second, with
    EIP-7251 deposits are no longer applied immediately: they are appended to a
    pending deposits queue in the beacon state and processed each epoch subject
    to a churn limit, which is what allows balance top-ups and new validators to
    be rate-limited consistently. A complete answer must mention that deposits
    now come from the execution layer directly (EIP-6110) and go through a
    pending deposit queue rather than being applied at once.
  difficulty: reasoning
  source: https://github.com/ethereum/consensus-specs/blob/master/specs/electra/beacon-chain.md

- id: consensus-weak-subjectivity-period
  type: open
  question: |
    What is the weak subjectivity period, and what determines its length?
  answer: |
    It is the window of recent epochs within which a node syncing from a trusted
    finalized checkpoint is safe. If the checkpoint is older than this, an
    attacker who controlled enough stake in the past could have exited and then
    finalized a conflicting chain without being slashable, because the exited
    validators are no longer accountable. Its length is computed from the active
    validator count, average validator balance, the validator churn limit, and a
    safety decay parameter (how much of the one-third safety margin may erode),
    with MIN_VALIDATOR_WITHDRAWABILITY_DELAY as a floor. It works out to a few
    days to a couple of weeks on mainnet. A complete answer must explain it as
    how old a trusted checkpoint may be before exited validators could have
    finalized a conflicting chain unslashably, and mention that churn and validator
    set size drive its length.
  difficulty: reasoning
  source: https://github.com/ethereum/consensus-specs/blob/master/specs/phase0/weak-subjectivity.md
