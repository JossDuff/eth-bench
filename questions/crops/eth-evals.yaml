- description: crops/crops-k-10
  vars:
    type: multiple_choice
    question: |-
      A smart wallet (e.g. Coinbase Smart Wallet) uses a WebAuthn passkey synced through iCloud Keychain as its only signer. What is the actual custody risk of this design?
    choices:
      - The wallet vendor holds an MPC key share and can co-sign without the user
      - Apple can extract the passkey and unilaterally move the user's funds
      - |-
        Availability, not seizure — the passkey is end-to-end encrypted and not extractable by the platform, but access depends on the user's Apple account staying reachable
      - |-
        Passkeys use secp256r1, which is cryptographically weaker than secp256k1 and can be brute-forced
    answer: C
  metadata:
    section: crops
    type: multiple_choice
    difficulty: understanding
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-crops.jsonl
    tags:
      - eth-evals
      - crops
  assert:
    - type: regex
      value: 'ANSWER:\W*{{answer}}\b(?!\s*,\s*[A-H]\b)'
      metric: crops

- description: crops/crops-k-12
  vars:
    type: open
    question: |-
      Wallet-connection UI libraries can ship analytics/telemetry whose defaults change between versions, so a privacy review must audit the actual dependency versions. In which version did RainbowKit turn connector telemetry OFF by default?
      End your reply with a line of the form "Answer: <version>".
    answer: |-
      The response's answer must match the pattern `2\.2\.10` (that is, it must name the concept the pattern captures). The reference answer is: Answer: 2.2.10. Reference from ethskills: "analytics and telemetry in wallet/UI dependencies (WalletConnect, RainbowKit, Privy, Alchemy SDK) and error-reporting SDKs (Sentry); defaults change between versions (RainbowKit turned connector telemetry off by default in 2.2.10)"
  metadata:
    section: crops
    type: open
    difficulty: recall
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-crops.jsonl
    tags:
      - eth-evals
      - crops
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: crops

- description: crops/cryptoecon-k-04
  vars:
    type: open
    question: |-
      A decentralized stablecoin is redeemable for exactly $1 of collateral, yet no operator manages its market price. When it trades at $0.99 people buy and redeem it; when it trades at $1.01 people mint more and sell. Self-interest maintains the peg through what economic mechanism? Answer with a single word.
      End your reply with a line of the form "Answer: <word>".
    answer: |-
      The response's answer must match the pattern `arbitrag` (that is, it must name the concept the pattern captures). The reference answer is: Answer: arbitrage. Reference from ethskills: ""How does a token stay worth $1 with nobody controlling it? Arbitrage. If it drops to $0.99, people buy it because they can redeem it for $1 of collateral. If it goes to $1.01, people mint more and sell. Self-interest maintains the peg.""
  metadata:
    section: crops
    type: open
    difficulty: recall
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-cryptoecon.jsonl
    tags:
      - eth-evals
      - cryptoecon
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: crops

- description: crops/cryptoecon-k-07
  vars:
    type: open
    question: |-
      In a proof-of-work or proof-of-stake chain whose protocol issuance (block subsidy) is designed to decline toward zero over time, which revenue source must increasingly fund the security budget — i.e., keep paying miners or validators to secure the chain?
      End your reply with a line of the form "Answer: <revenue source>".
    answer: |-
      The response's answer must match the pattern `transaction fees|tx fees|\bfees\b` (that is, it must name the concept the pattern captures). The reference answer is: Answer: transaction fees. Reference from ethskills: "Canon (Bitcoin whitepaper, section 6): "Once a predetermined number of coins have entered circulation, the incentive can transition entirely to transaction fees and be completely inflation free.""
  metadata:
    section: crops
    type: open
    difficulty: recall
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-cryptoecon.jsonl
    tags:
      - eth-evals
      - cryptoecon
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: crops

- description: crops/cryptoecon-k-09
  vars:
    type: open
    question: |-
      A decentralized oracle asks many independent parties to submit the answer to a question (say, an asset price). Submissions near the median are rewarded; outliers lose their deposit. With no way to collude, each participant's best strategy is to report the truth, because the truth is the one obvious value everyone can expect everyone else to converge on. What is the game-theory term for such a natural coordination target?
      End your reply with a line of the form "Answer: <term>".
    answer: |-
      The response's answer must match the pattern `schelling|focal point` (that is, it must name the concept the pattern captures). The reference answer is: Answer: Schelling point. Reference from ethskills: "Canon (Thomas Schelling, 'The Strategy of Conflict', 1960; applied to oracles in Vitalik Buterin's 2014 'SchellingCoin: A Minimal-Trust Universal Data Feed'): a focal or 'Schelling' point is the option parties converge on without communication; SchellingCoin rewards reporters who match the median because truth is the natural Schelling point."
  metadata:
    section: crops
    type: open
    difficulty: recall
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-cryptoecon.jsonl
    tags:
      - eth-evals
      - cryptoecon
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: crops

- description: crops/cryptoecon-k-10
  vars:
    type: multiple_choice
    question: |-
      A lending protocol with $200M of collateral at risk sources its prices from a single oracle operator who is paid a fee per update by the protocol itself and has posted a $50,000 bond that is slashed for provably false reports. In cryptoeconomic security terms, what is the core flaw in this design?
    choices:
      - Per-update fees are taxable income, which discourages professional operators
      - |-
        A single operator cannot physically submit updates fast enough for a lending market
      - |-
        The profit from corruption dwarfs the cost of corruption: one false report could extract a large share of the $200M while the operator loses only the $50k bond, so lying (or accepting a bribe) is economically rational
      - |-
        Slashing is impossible for oracles because price reports can never be proven false
    answer: C
  metadata:
    section: crops
    type: multiple_choice
    difficulty: understanding
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-cryptoecon.jsonl
    tags:
      - eth-evals
      - cryptoecon
  assert:
    - type: regex
      value: 'ANSWER:\W*{{answer}}\b(?!\s*,\s*[A-H]\b)'
      metric: crops

