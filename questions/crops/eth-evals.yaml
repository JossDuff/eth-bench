      End your reply with a line of the form "Answer: <two words>".
    answer: |-
      The response's answer must match the pattern `selectively\s+reveal` (that is, it must name the concept the pattern captures). The reference answer is: Answer: selectively reveal. Reference from ethskills: "Eric Hughes, A Cypherpunk's Manifesto (1993): "Privacy is the power to selectively reveal oneself to the world.""
