- id: concepts-02-walkaway-test
  type: multiple_choice
  question: |
    A DeFi protocol is fully audited and its incentives look healthy, but advancing each epoch requires the founding team to trigger the next phase from an admin account. Apply the design test "Could this run forever with no team behind it?" (the walkaway test). Does this protocol pass, and what kind of system is it?
  choices:
  - |-
    Fails — it is a service, not a hyperstructure: it dies when the team stops operating it, and the admin is a single point of failure
  - Passes — admin actions are cheap, so any team could take over
  - Passes — audits guarantee it will keep running regardless of the team
  - Fails — but only because epoch transitions cost gas that the team must subsidize
  answer: A
  difficulty: understanding
  source: |-
    https://github.com/austintgriffith/ethevals/blob/main/evals/concepts/concepts-02-walkaway-test.yaml
  tags:
  - ethevals
  - concepts
