      metric: crops

- description: crops/concepts-08-verified-is-not-open
  vars:
    type: multiple_choice
    question: |-
      A team claims their dapp is "fully open source" because the deployed contract is verified on Etherscan. In a CROPS-style openness review, what does Etherscan verification actually establish?
    choices:
      - |-
        That the bytecode matches published source for that one contract, and nothing more
      - That the license grants third parties the right to fork and run the code
      - That the live frontend can be reproduced from a pinned commit
      - |-
        That the entire stack — contracts, frontend, and indexer — is public and forkable
    answer: A
  metadata:
    section: crops
    type: multiple_choice
    difficulty: understanding
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/concepts/concepts-08-verified-is-not-open.yaml
    tags:
      - ethevals
      - concepts
  assert:
    - type: regex
      value: 'ANSWER:\W*{{answer}}\b(?!\s*,\s*[A-H]\b)'
      metric: crops

- description: crops/concepts-17-forced-inclusion
  vars:
    type: open
    question: |-
      A dapp deploys on an L2 with a centralized sequencer. Before claiming users can escape sequencer censorship by forcing a transaction through L1, which website does ecosystem guidance say to check for that specific chain's forced-inclusion and sequencer trust assumptions?
      End your reply with a line of the form "Answer: <website>".
    answer: |-
      The response's answer must match the pattern `l2\s*beat` (that is, it must name the concept the pattern captures). The reference answer is: Answer: l2beat.com.
  metadata:
    section: crops
    type: open
    difficulty: recall
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/concepts/concepts-17-forced-inclusion.yaml
    tags:
      - ethevals
      - concepts
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: crops

- description: crops/concepts-18-admin-power-mechanisms
  vars:
    type: open
    question: |-
      A review finds a contract where a single `onlyOwner` key can pause, upgrade, and seize funds, and the team insists some admin power must survive launch. Per CROPS-style guidance, name the TWO onchain mechanisms that any surviving admin power should be placed behind.
      End your reply with a line of the form "Answer: <mechanism 1> and <mechanism 2>".
    answer: |-
      The response must mention every one of these: `multi.?sig|\bsafe\b`, `time.?lock`. The reference answer is: Answer: a multisig (Safe) and a timelock.
  metadata:
    section: crops
    type: open
    difficulty: recall
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/concepts/concepts-18-admin-power-mechanisms.yaml
    tags:
      - ethevals
      - concepts
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: crops
