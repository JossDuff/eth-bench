- description: crops/concepts-02-walkaway-test
  vars:
    type: multiple_choice
    question: |-
      A DeFi protocol is fully audited and its incentives look healthy, but advancing each epoch requires the founding team to trigger the next phase from an admin account. Apply the design test "Could this run forever with no team behind it?" (the walkaway test). Does this protocol pass, and what kind of system is it?
    choices:
      - Fails — but only because epoch transitions cost gas that the team must subsidize
      - Passes — admin actions are cheap, so any team could take over
      - |-
        Fails — it is a service, not a hyperstructure: it dies when the team stops operating it, and the admin is a single point of failure
      - Passes — audits guarantee it will keep running regardless of the team
    answer: C
  metadata:
    section: crops
    type: multiple_choice
    difficulty: understanding
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/concepts/concepts-02-walkaway-test.yaml
    tags:
      - ethevals
      - concepts
  assert:
    - type: regex
      value: 'ANSWER:\W*{{answer}}\b(?!\s*,\s*[A-H]\b)'
      metric: crops

- description: crops/concepts-04-hyperstructures
  vars:
    type: open
    question: |-
      The Ethereum community has a specific term for an unstoppable protocol that runs forever with no operator, no company, no server, and no admin key — sustained purely by its own incentives (Uniswap is the canonical example). What is the term?
      End your reply with a line of the form "Answer: <term>".
    answer: |-
      The response's answer must match the pattern `hyper[\s-]*structure` (that is, it must name the concept the pattern captures). The reference answer is: Answer: a hyperstructure.
  metadata:
    section: crops
    type: open
    difficulty: recall
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/concepts/concepts-04-hyperstructures.yaml
    tags:
      - ethevals
      - concepts
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: crops

- description: crops/concepts-05-fee-switch-fork
  vars:
    type: multiple_choice
    question: |-
      A team forks a Uniswap-style AMM but changes one rule: 100% of swap fees go to a founder-controlled treasury instead of to liquidity providers. Trading works fine on day one. In the original design, the 0.3% swap fee paid to LPs drives the flywheel (more liquidity → less slippage → more traders → more fees → more liquidity). Which participant group defects from the fork, and with what result?
    choices:
      - |-
        Validators — they censor the fork's transactions because the fee routing is non-standard
      - |-
        Traders — they refuse to pay fees that don't go to LPs, so volume drops but liquidity is unaffected
      - |-
        LPs — with no fee income there is no reason to deposit, so liquidity leaves, slippage worsens, and the flywheel never starts
      - |-
        The founders — treasury accumulation forces them to become the market maker of last resort
    answer: C
  metadata:
    section: crops
    type: multiple_choice
    difficulty: understanding
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/concepts/concepts-05-fee-switch-fork.yaml
    tags:
      - ethevals
      - concepts
  assert:
    - type: regex
      value: 'ANSWER:\W*{{answer}}\b(?!\s*,\s*[A-H]\b)'
      metric: crops

- description: crops/concepts-06-sybil-resistance
  vars:
    type: open
    question: |-
      A voting-based onchain mechanism gives every distinct address one vote. An attacker generates thousands of fresh addresses for free and captures the vote. What is the standard name for this attack — the one that explains why blockchain consensus weights influence by a costly, scarce resource (work or stake) instead of by identity count?
      End your reply with a line of the form "Answer: <attack name>".
    answer: |-
      The response's answer must match the pattern `sybil` (that is, it must name the concept the pattern captures). The reference answer is: Answer: Sybil attack.
  metadata:
    section: crops
    type: open
    difficulty: recall
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/concepts/concepts-06-sybil-resistance.yaml
    tags:
      - ethevals
      - concepts
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: crops

- description: crops/concepts-07-crops-pillars
  vars:
    type: multiple_choice
    question: |-
      A dapp's smart contracts are fully permissionless, but the only usable UI is hosted by one provider, which geofences users by IP and filters connecting wallet addresses against OFAC compliance lists. Which CROPS pillar does this setup most directly violate?
    choices:
      - Privacy
      - Security
      - Censorship Resistance
      - Open Source and Free
    answer: C
  metadata:
    section: crops
    type: multiple_choice
    difficulty: understanding
