- id: crops-founder-funding-decision
  type: open
  question: |
    You are the lead founder of a new general-purpose blockchain platform, a few
    months before its public launch. The team must decide how the project is
    structured and funded. Several cofounders want to incorporate as a for-profit
    company, raise venture capital, and reserve the right to keep parts of the
    software proprietary so investors have something to capture. Others argue the
    project should be run by a nonprofit foundation, release all of its software
    under free and open source licenses, and fund development by selling the
    network's native token to the public rather than selling equity to investors.

    Which path should the project take, and why?
  answer: |
    The nonprofit, fully open source, no venture capital path. Reasoning a complete
    answer should give, in some form: a protocol meant to be neutral shared
    infrastructure cannot be owned by a company whose investors expect returns,
    because that creates pressure to extract value from users and to privilege
    the company over everyone else building on it; open source and free licensing
    are what let anyone build on, verify, and fork the protocol, which is the
    source of its trust and network effects; and funding through a public token
    sale keeps the community, not a small set of equity holders, as the
    stakeholders. This mirrors the 2014 decision by Ethereum to structure the project as a
    Swiss nonprofit foundation funded by a public ether sale, over the objections
    of cofounders who wanted a venture-backed company, several of whom left as a
    result.

    Grade CORRECT if the response chooses the nonprofit and open source path and
    gives at least one of the reasons above (neutrality or avoiding investor
    control, openness as the basis of trust and permissionless building, or
    aligning stakeholders with users rather than equity holders) or cites Ethereum. Grade INCORRECT
    if it recommends the for-profit venture-backed path or proprietary software.
    Grade NOT_ATTEMPTED if it refuses to choose and only lists tradeoffs.
  difficulty: reasoning
  source: https://blog.ethereum.org/2014/07/22/launching-the-ether-sale

- id: crops-wrench-attack
  type: open
  question: |
    A user of the Ethereum blockchain was just robbed at their house and forced 
    to give their private key to the attackers.  The attackers knew the public key
    of the user and the fact that the user had a lot of money on-chain.

    How could the user have prevented this?
  answer: |
    The attack was possible because the attackers could link the user's real
    identity to an on-chain address and see its balance. 

    Privacy, so the user is never targeted: do not tie addresses to identity, for
    example through an ENS name, a public post, or reuse of one address for
    everything. Hold or move large
    balances through shielded pools or privacy-preserving mechanisms (Tornado Cash, Railgun,
    Privacy Pools) so the
    balance of any public address is unremarkable. Spread holdings across
    unlinked addresses so no single visible address reveals total wealth.

    Grade CORRECT if the response identifies that the root cause was the public
    link between identity, address, and balance and proposes at least one
    privacy measure (stealth addresses, shielded or private transfers, not
    linking identity to addresses, splitting holdings). Grade INCORRECT if it suggests 
    only measures that do not address the privacy leak. Grade NOT_ATTEMPTED if it 
    does not propose any prevention.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-5564

- id: crops-what-is-crops
  type: multiple_choice
  question: |
    What does the Ethereum Foundation's acronym "CROPS" stand for?
  choices:
    - Censorship Resistance, Opennness, Permissionlessness, Scalability
    - Credible neutrality, censorship Resistance, Open source, Privacy, Security
    - Consensus, Rollups, Open standards, Privacy, Sharding
    - Censorship Resistance, Open Source and free as in freedom, Privacy, Security
    - Cryptography, Resilience, Open source and free, Privacy, Security
  answer: D
  difficulty: recall
  source: https://ethereum.foundation/ef-mandate.pdf 

- id: crops-mandate-cross-layer-capture
  type: open
  question: |
    The Ethereum Foundation's mandate says the CROPS properties must be treated
    as "an indivisible whole" and warns against the temptation to "treat CROPS
    properties in isolation, and to consider any gaps acceptable as long as they
    can be compensated for elsewhere."

    Explain the failure mode this warning is about. Then illustrate it with a
    protocol design choice under which the base protocol stays formally
    CROPS-compliant while users' effective self-sovereignty gets worse.
  answer: |
    The failure mode is displacement of capture across layers. A need the
    protocol does not meet does not disappear; users satisfy it through
    intermediaries built on top, and those intermediaries tend to be
    centralized, permissioned, trust-dependent, or opaque. The protocol itself
    can remain "pristine" by a checklist reading of CROPS while censorship
    resistance, privacy, or user control are lost one layer up, so judging a
    proposal only at the layer at hand misses where the chokepoint actually
    lands. The mandate's response is to reason about higher-order effects across
    the whole stack and to prefer native protocol capabilities when they remove
    entire classes of intermediaries, while still weighing the complexity risk
    that protocol changes carry.

    Any of the mandate's own five examples, or an equivalent, serves as the
    illustration. Scale: if the protocol cannot handle a use case, users process
    transactions in extra-protocol systems and post proofs back, unknowingly
    accepting deeper CROPS compromises. Account types: without a native
    general-purpose smart account model, smart account use cases can only be
    served through intermediaries, degrading CROPS properties and liveness even
    if many intermediaries compete. Privacy: leaving privacy to the application
    layer yields anonymity sets no layered construction can match, versus
    protocol-native privacy. Transaction protections: leaving inclusion and
    fair-execution guarantees to intermediaries pushes users into centralized,
    extractive transaction pipelines such as private relays. Aggregation:
    leaving proof aggregation off-protocol produces a high-fixed-cost,
    likely monopolistic aggregation chokepoint.

    Grade CORRECT if the response explains that unmet needs migrate into
    centralized or trust-dependent intermediaries so capture is displaced
    rather than removed, and gives one concrete illustration of that
    displacement. Grade INCORRECT if it treats the warning as being only about
    balancing the four properties against each other, or if the example it
    gives is one where the protocol itself is what fails CROPS. Grade
    NOT_ATTEMPTED if it does not explain the mechanism.
  difficulty: reasoning
  source: https://ethereum.foundation/ef-mandate.pdf


- id: crops-walkaway-test
  type: open
  question: |
    The Ethereum Foundation's mandate says the ultimate goal is for Ethereum
    to pass the "walkaway test". What is the test, and how does the mandate
    extend it beyond the protocol?
  answer: |
    The walkaway test asks whether Ethereum's protocol and core application
    layers are robust and trustless enough that they would keep functioning and
    evolving reliably even if the Ethereum Foundation and today's core developers
    disappeared tomorrow. Under the Security principle the mandate applies it to
    users as well: self-sovereignty means a user should not be forced into
    frequent, complex migrations that create unintended risk; systems should
    keep working for users without the team behind them. Passing it requires
    intermediary minimisation and structural decentralisation. A complete answer
    must describe continued functioning without the EF or current core devs,
    and mention the extension to users (no forced migrations, or working
    without the team or vendor).
  difficulty: understanding
  source: https://ethereum.foundation/ef-mandate.pdf

