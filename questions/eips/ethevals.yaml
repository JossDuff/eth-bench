- id: concepts-22-7702-no-recursion
  type: multiple_choice
  question: |
    Under EIP-7702, account A is delegated to B (A's code is 0xef0100 followed by B's address), and B is itself an EOA delegated to C. A transaction calls A. What runs?
  choices:
  - 'C''s code: delegation resolves transitively until real bytecode is found'
  - |-
    Only one hop is followed: the EVM loads B's code, which is B's own 23-byte delegation designator, not C's code; the designator is not executable, so the call fails without running anything useful
  - The transaction is invalid and never enters a block
  - B's code, but with C's storage
  answer: B
  difficulty: understanding
  source: |-
    https://github.com/austintgriffith/ethevals/blob/main/evals/concepts/concepts-22-7702-no-recursion.yaml
  tags:
  - ethevals
  - concepts
- id: concepts-23-7702-bad-tuple
  type: multiple_choice
  question: |
    A type-4 transaction carries two authorization tuples. One was signed for a different chain id. What happens when the transaction is included?
  choices:
  - The whole transaction is invalid and cannot be included
  - |-
    The mismatched tuple is skipped, the other is applied, the transaction executes normally and is charged for both tuples; only an empty authorization list makes the transaction itself invalid
  - The transaction reverts and the sender pays nothing
  - |-
    Both tuples are applied, because authorizations are validated at signing time, not at inclusion
  answer: B
  difficulty: understanding
  source: |-
    https://github.com/austintgriffith/ethevals/blob/main/evals/concepts/concepts-23-7702-bad-tuple.yaml
  tags:
  - ethevals
  - concepts
