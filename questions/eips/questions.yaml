- id: eip-1153-transient-storage-lifetime
  type: open
  question: |
    Contract A writes a value with TSTORE during one call. Later in the same
    transaction, a different contract calls A again and A executes TLOAD on the
    same key. What does the TLOAD return, and what is the state of that
    transient slot at the start of the next transaction?
  answer: |
    The TLOAD returns the value written earlier. Transient storage (EIP-1153) is
    scoped to the transaction, not to a single call frame, so it persists across
    separate calls into the same contract within one transaction; it is only
    undone if the frame that wrote it reverts. At the end of the transaction all
    transient storage is discarded, so at the start of the next transaction the
    slot reads as zero. TLOAD and TSTORE each cost 100 gas. A complete answer
    must say the value is still readable in the later call within the same
    transaction and that transient storage is cleared between transactions.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-1153

- id: eip-3529-refund-reduction
  type: open
  question: |
    What did EIP-3529 (London) change about gas refunds, and what behaviour
    was it trying to eliminate?
  answer: |
    EIP-3529 removed the 24,000 gas refund for SELFDESTRUCT, cut the refund for
    clearing a storage slot (SSTORE to zero) from 15,000 to 4,800, and capped
    total refunds at one fifth of the gas used by the transaction (previously
    one half). The target was gas tokens: contracts such as GST2 and CHI that
    filled storage or created contracts when gas was cheap and then cleared or
    self-destructed them when gas was expensive to collect refunds, which
    inflated state, made block gas usage swing wildly (a block could use far
    more than the limit's worth of work), and undermined EIP-1559's base fee
    signal. A complete answer must mention the reduced or removed refunds and
    the lower refund cap, and connect them to gas tokens or refund-driven state
    bloat and block size variance.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-3529

- id: eip-2930-access-list-savings
  type: multiple_choice
  question: |
    A transaction includes an EIP-2930 access list naming one contract address
    and two of its storage slots, all of which the transaction then actually
    touches. Compared with the same transaction without the access list, how
    does the total gas change?
  choices:
    - It saves 600 gas (200 per listed item)
    - It saves 2,100 gas (one cold storage access)
    - It costs 6,200 more gas (the list is charged on top of cold access)
    - It is unchanged; the list only affects what is included in the receipt
  answer: A
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-2930

- id: eip-4788-beacon-root-contract
  type: open
  question: |
    What does EIP-4788 expose to the EVM, how long is each value available, and
    who uses it?
  answer: |
    EIP-4788 (Cancun) makes the parent beacon block root available in the EVM.
    Each block header carries parentBeaconBlockRoot, and a system contract at
    0x000F3df6D732807Ef1319fB7B8bB8522d0Beac02 stores the roots in a ring
    buffer of HISTORY_BUFFER_LENGTH = 8191 slots (about 27 hours), keyed by
    timestamp; a contract calls it with a timestamp to get the root. Because a
    beacon block root commits to the whole beacon state, contracts can verify
    Merkle proofs about validators, balances, and withdrawals without an
    oracle: liquid staking protocols, restaking, and bridges or light clients
    use it. A complete answer must say the parent beacon block root is exposed
    via a system contract, that roughly a day of roots is kept (8191), and
    give one use such as trustless proofs about validator state.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-4788

- id: eip-7002-execution-triggered-exits
  type: open
  question: |
    What does EIP-7002 allow, and why was it needed even though validators
    could already exit voluntarily?
  answer: |
    EIP-7002 (Pectra) lets the owner of a validator's 0x01 or 0x02 withdrawal
    credentials trigger a full exit or a partial withdrawal from the execution
    layer, by calling a system contract that queues withdrawal requests (paying
    a dynamically priced fee) which are delivered to the beacon chain via
    EIP-7685 requests, up to 16 per block with a target of 2. Before it, only
    the validator's active (signing) key could sign a voluntary exit. That
    meant a staker who delegated operation to a node operator could not
    reclaim their stake if the operator disappeared or refused, so staking
    pools needed trusted pre-signed exits or legal agreements. Letting the
    withdrawal credential holder exit removes that trust and lets smart
    contracts manage exits programmatically. A complete answer must say the
    withdrawal address can trigger exits through a system contract, and give
    the reason that previously only the signing key could exit, leaving stakers
    dependent on operators.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-7002

- id: eip-7549-committee-index
  type: open
  question: |
    What did EIP-7549 change about attestations, and what did it make possible?
  answer: |
    EIP-7549 (Pectra/Electra) moved the committee index out of the signed
    AttestationData (the index field is fixed to zero) and into the outer
    Attestation container as committee_bits. Because the signed message no
    longer differs between committees voting for the same head, source, and
    target, attestations from every committee in a slot can be aggregated into
    one signature, so far fewer pairings are needed to verify consensus
    (important for ZK provers and light clients), and a block can carry up to 8
    slots' worth of aggregated votes instead of about 2, reducing
    MAX_ATTESTATIONS to 8. A complete answer must say the committee index was
    moved outside the signed data so identical votes across committees can be
    aggregated together.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-7549

