- id: eip-7685-execution-requests
  type: open
  question: |
    What does EIP-7685 add to the execution block, and which request types used
    it when Pectra shipped?
  answer: |
    EIP-7685 defines a general framework for execution layer triggered requests
    to the consensus layer. Each request is a type byte followed by opaque
    request data, and the header gains a requests_hash field: the sha256 of the
    sha256 hashes of each non-empty requests object, ordered by type. Pectra used
    three types: 0x00 deposit requests (EIP-6110), 0x01 withdrawal requests
    (EIP-7002), and 0x02 consolidation requests (EIP-7251). A complete answer
    must mention a requests commitment in the block header and name at least
    two of deposits, withdrawals, and consolidations as the request types.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-7685

