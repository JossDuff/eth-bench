- id: eip-3651-warm-coinbase-rationale
  type: open
  question: |
    Why did Shanghai make the COINBASE address warm at the start of every
    transaction (EIP-3651)?
  answer: |
    After the Merge, searchers and users increasingly pay block builders
    directly by transferring ETH to the COINBASE address inside the
    transaction, because such payments are conditional: if the transaction
    reverts the payment does not happen, unlike a priority fee. Under EIP-2929
    the coinbase was a cold address, so the first such transfer cost an extra
    2,600 gas even though clients already have that account loaded. The
    overpricing pushed builders toward alternative payment routes such as ERC-20
    transfers, when ETH should be the primary means of paying for inclusion.
    Warming COINBASE removes the mispricing. A complete answer must connect the
    change to direct ETH payments to the block producer (MEV or conditional
    payments) being overpriced by the cold access cost.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-3651

