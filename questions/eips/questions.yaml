- id: eip-7918-blob-reserve-price
  type: open
  question: |
    What problem did EIP-7918 (Fusaka) fix in the blob fee market, and how does
    it fix it?
  answer: |
    When execution gas costs dominated the total cost of posting a blob, the
    blob base fee stopped being a meaningful price signal: demand did not
    respond to it, so the EIP-4844 update rule kept lowering it until it sat at
    1 wei, and recovering to a market-clearing price after a demand spike took
    an hour or more of full blocks. EIP-7918 adds a reserve price tied to
    execution cost: BLOB_BASE_COST (2**13) multiplied by the execution base fee.
    When a blob's price (GAS_PER_BLOB times the blob base fee) is below that
    reserve, calc_excess_blob_gas no longer subtracts the target from the excess,
    so the blob base fee cannot keep falling below roughly the execution cost of
    a blob. A complete answer must say the blob base fee was collapsing to a
    floor because execution cost dominated, and that the fix bounds the blob
    base fee from below by a value proportional to the execution base fee.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-7918

