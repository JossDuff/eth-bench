- id: eip-7702-delegation-survives-revert
  type: open
  question: |
    A type-4 (EIP-7702) transaction carries one valid authorization tuple. The
    transaction's execution reverts. After the block is processed, does the
    authority's account have the delegation indicator set, and what happened to
    the authority's nonce?
  answer: |
    Yes, the delegation is set. The authorization list is processed before the
    execution portion of the transaction begins, and the spec states that
    processed delegation indicators are not rolled back if execution fails. The
    authority's nonce was also incremented by one as part of processing the
    tuple, and that increment stands too. The sender still pays for the
    authorization regardless of validity. A complete answer must say the
    delegation persists despite the revert and that the authority's nonce was
    incremented.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-7702

