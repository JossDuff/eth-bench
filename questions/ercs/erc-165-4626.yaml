- id: erc-165-interface-id
  type: open
  question: |
    How is an interface identifier computed under ERC-165?
  answer: |
    The interface id is the XOR of the four-byte function selectors of every
    function in the interface. A complete answer must mention XOR of the function
    selectors.
  difficulty: recall
  source: https://eips.ethereum.org/EIPS/eip-165

- id: erc-4626-standardizes
  type: multiple_choice
  question: |
    What does ERC-4626 standardize?
  choices:
    - Tokenized yield-bearing vaults
    - Non-fungible token metadata
    - Multi-signature wallets
    - Token bridges between rollups
  answer: A
  difficulty: recall
  source: https://eips.ethereum.org/EIPS/eip-4626
