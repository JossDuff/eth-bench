- id: erc-20-approve-function
  type: multiple_choice
  question: |
    In ERC-20, which function does a token holder call to let another address
    spend tokens on their behalf?
  choices:
    - transfer
    - approve
    - transferFrom
    - allowance
  answer: B
  difficulty: recall
  source: https://eips.ethereum.org/EIPS/eip-20

- id: erc-2612-permit-purpose
  type: open
  question: |
    What problem does ERC-2612 (permit) solve for ERC-20 tokens?
  answer: |
    ERC-20 approvals normally require the token holder to send their own
    on-chain approve transaction before a contract can move their tokens, which
    costs gas and requires the holder to hold ETH. ERC-2612 adds a permit
    function that accepts a signed message (EIP-712 typed data) authorizing an
    allowance, so approval can be submitted by anyone, including bundled into the
    same transaction that spends the tokens. A complete answer must mention that
    approvals become signature-based (gasless for the holder) instead of requiring
    a separate approve transaction.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-2612
