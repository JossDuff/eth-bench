- description: ercs/concepts-13-eip712-replay
  vars:
    type: open
    question: |-
      A protocol verifies user signatures over typed structured data per EIP-712. Which component of the signed digest is specifically responsible for preventing a valid signature from being replayed against a different contract or on a different chain?
      End your reply with a line of the form "Answer: <short answer>".
    answer: |-
      The response's answer must match the pattern `domain[\s_-]?separator` (that is, it must name the concept the pattern captures). The reference answer is: Answer: the domain separator.
  metadata:
    section: ercs
    type: open
    difficulty: recall
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/concepts/concepts-13-eip712-replay.yaml
    tags:
      - ethevals
      - concepts
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: ercs

- description: ercs/concepts-15-paymaster-deposit
  vars:
    type: multiple_choice
    question: |-
      An ERC-4337 paymaster contract on Ethereum mainnet holds 5 ETH at its own address, yet every UserOperation that names it is rejected by the bundler at validation with AA31 "paymaster deposit too low". Why?
    choices:
      - Bundlers only accept paymasters that are also stakers on the beacon chain
      - |-
        The EntryPoint prepays gas from the paymaster's deposit held at the EntryPoint (funded via depositTo / addStake), not from ETH sitting in the paymaster's own balance
      - The paymaster's ETH is locked until the UserOperation's nonce is consumed
      - The paymaster must hold at least 32 ETH before the EntryPoint will trust it
    answer: B
  metadata:
    section: ercs
    type: multiple_choice
    difficulty: understanding
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/concepts/concepts-15-paymaster-deposit.yaml
    tags:
      - ethevals
      - concepts
  assert:
    - type: regex
      value: 'ANSWER:\W*{{answer}}\b(?!\s*,\s*[A-H]\b)'
      metric: ercs

- description: ercs/concepts-25-1271-replay-safe
  vars:
    type: multiple_choice
    question: |-
      A smart account owned by the EOA K does not let K sign an ERC-1271 hash directly. It wraps it first: K signs hashTypedData(domain{chainId, verifyingContract: this account}, Message(bytes32 hash)). Why?
    choices:
      - |-
        K may own other accounts on this and other chains; a bare signature by K over the hash would satisfy isValidSignature on every account K owns, so a signature produced for one account could be replayed as another account's approval (a permit, an order). Binding the account's own domain into the digest makes it valid for one account on one chain.
      - It hides the original message from the verifier
      - It saves gas in isValidSignature
      - ERC-1271 requires the signed data to be EIP-712 typed data
    answer: A
  metadata:
    section: ercs
    type: multiple_choice
    difficulty: understanding
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/concepts/concepts-25-1271-replay-safe.yaml
    tags:
      - ethevals
      - concepts
  assert:
    - type: regex
      value: 'ANSWER:\W*{{answer}}\b(?!\s*,\s*[A-H]\b)'
      metric: ercs

