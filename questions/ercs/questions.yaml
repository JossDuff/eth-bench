- id: erc-1155-batch-callback-balance-order
  type: open
  question: |-
    An ERC-1155 holder has 10 units of token ID 7. A distinct receiver contract
    initially has none. A successful safeBatchTransferFrom sends IDs [7, 7]
    with amounts [3, 4] to that receiver. At the start of
    onERC1155BatchReceived, before the receiver performs any further calls,
    what balances must balanceOf report for the holder and receiver for ID 7?
    Explain the ordering requirement.
  answer: |-
    The holder must have 3 units and the receiver must have 7 units. All balance
    changes for the batch must be applied before the receiver hook is called,
    including both entries for the repeated token ID. A complete answer must
    give both balances and state that the hook runs after the batch's balance
    updates, not between entries or before the updates.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-1155
- id: erc-712-struct-array-field-encoding
  type: open
  question: |-
    Under EIP-712, consider the types Item(string label,uint256 amount) and
    Basket(Item[] items). A Basket contains exactly two items, and their
    EIP-712 hashStruct values are h0 and h1, each 32 bytes. What exact byte
    sequence is hashed to produce the 32-byte encoding of the items field?
    Does that sequence contain an ABI array offset or length?
  answer: |-
    The field is encoded as keccak256(h0 || h1): the hashed byte sequence is
    exactly the 64-byte concatenation of the two hashStruct values, in array
    order. It contains neither an ABI offset nor an array length.
    A complete answer must specify this concatenation and exclude offset and
    length words. It need not expand the individual Item hashes.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-712
