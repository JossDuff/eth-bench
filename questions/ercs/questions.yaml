- description: ercs/erc-4337-paymaster-flow
  vars:
    type: open
    question: |-
      In ERC-4337, how does a paymaster sponsor a UserOperation, and how does the
      EntryPoint make sure the paymaster actually pays?
    answer: |-
      A UserOperation names a paymaster in paymasterAndData. During validation the
      EntryPoint calls the paymaster's validatePaymasterUserOp, which checks
      whatever policy it likes (an off-chain signature, an ERC-20 balance to
      charge) and returns context plus validity data. The EntryPoint pays the
      bundler for gas out of a deposit the paymaster has previously placed in the
      EntryPoint, so the paymaster must prefund its deposit (and stake to use the
      shared mempool with less restricted validation). After execution the
      EntryPoint calls the paymaster's postOp with the actual gas cost so it can,
      for example, pull ERC-20 tokens from the user. A complete answer must say
      the paymaster is validated by the EntryPoint and pays from a deposit held
      in the EntryPoint, and mention postOp or the ability to charge the user in
      another token.
  metadata:
    section: ercs
    type: open
    difficulty: understanding
    source: https://eips.ethereum.org/EIPS/eip-4337
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: ercs

- description: ercs/erc-4337-initcode-deployment
  vars:
    type: open
    question: |-
      How does ERC-4337 let a user send their first UserOperation from a smart
      account that does not exist yet?
    answer: |-
      The UserOperation carries a non-empty initCode field whose first 20 bytes
      are a factory contract address and whose remaining bytes are calldata for
      that factory. The EntryPoint calls the factory (through a SenderCreator
      helper) before validation, and the factory must deploy the account,
      typically with CREATE2 so its address is deterministic, and return an
      address equal to the UserOperation's sender or the operation fails. This
      counterfactual address can therefore receive funds before it is deployed,
      and the deployment gas is covered by the same operation (via
      verificationGasLimit). A complete answer must say the first 20 bytes of
      initCode are a factory that deploys the account and that the deployed
      address must match sender.
  metadata:
    section: ercs
    type: open
    difficulty: understanding
    source: https://eips.ethereum.org/EIPS/eip-4337
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: ercs

