- id: erc-20-approve-race
  type: open
  question: |
    What is the ERC-20 approve front-running problem, and how do wallets and
    token contracts work around it?
  answer: |
    approve overwrites the allowance. If a holder has approved a spender for N
    and sends a transaction changing it to M, the spender can watch the mempool,
    spend N before the change lands, and then spend M as well, extracting N + M
    instead of M. Workarounds include first setting the allowance to zero and
    checking it was not spent before setting the new value, using
    increaseAllowance and decreaseAllowance helpers that adjust relatively, or
    avoiding standing allowances entirely with signature-based mechanisms such
    as ERC-2612 permit or ERC-3009. A complete answer must describe the spender
    using the old allowance before the new one takes effect and name at least
    one mitigation.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-20

