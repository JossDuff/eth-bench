- id: erc-55-checksum-algorithm
  type: open
  question: |
    Describe precisely how the ERC-55 mixed-case checksum of an address is
    computed, including what exactly is hashed.
  answer: |
    Take the 40-character lowercase hexadecimal address without the 0x
    prefix, treat that string as ASCII bytes, and compute its keccak256 (the
    hash is of the hex text, not of the 20 raw address bytes). Then, for each
    position i of the address, if the character is a letter (a to f) and the
    hex digit at position i of the hash is 8 or greater (top bit of that
    nibble set), write it in uppercase; otherwise leave it as is. Decimal
    digits are never changed. A complete answer must state that the lowercase
    hex string itself is hashed and that a letter is uppercased when the
    corresponding hash nibble is at least 8.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-55

- id: erc-137-namehash-algorithm
  type: open
  question: |
    How does the ENS namehash algorithm from ERC-137 turn a dotted name into a
    32-byte node, and what is the base case?
  answer: |
    namehash of the empty name is 32 zero bytes. For a non-empty name, split
    off the leftmost label and compute keccak256(namehash(remainder) ||
    keccak256(label)), so the name is processed from the rightmost label
    inward: node = keccak256(0x00..00 || keccak256("eth")), then
    keccak256(node || keccak256("foo")) for foo.eth. Each label is hashed
    individually and labels are normalised with UTS-46 before hashing, so case
    does not matter. A complete answer must give the zero base case and the
    recursive concatenation of the parent node with the keccak of the label.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-137

- id: erc-1820-accept-magic-rationale
  type: open
  question: |
    When a contract is registered in the ERC-1820 registry as the implementer
    of an interface for a different address, what must its
    canImplementInterfaceForAddress function return, and why is that return
    type used instead of a boolean?
  answer: |
    It must return the bytes32 value keccak256("ERC1820_ACCEPT_MAGIC") when
    it implements the given interface hash for the given address, and must
    not return that value otherwise. A boolean was rejected because a contract
    that lacks canImplementInterfaceForAddress but has a non-reverting
    fallback function would answer the call successfully with data that
    decodes as 1, that is true, falsely appearing to accept the registration.
    A specific 32-byte magic value cannot be produced by accident. A complete
    answer must name the ERC1820_ACCEPT_MAGIC keccak value and explain the
    fallback-function false positive.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-1820

