- id: erc-2771-effective-sender-extraction
  type: open
  question: |
    How does an ERC-2771 recipient contract determine the effective sender of
    a call, and what condition gates the substitution?
  answer: |
    The trusted forwarder appends the transaction signer's 20-byte address to
    the end of the calldata (abi.encodePacked(data, from)). The recipient
    checks whether msg.sender is a trusted forwarder (via its own
    isTrustedForwarder logic); if so, and the calldata is at least 20 bytes,
    it reads the last 20 bytes of msg.data and uses that as the sender.
    Otherwise it uses msg.sender unchanged. Trusting only known forwarders is
    essential because any caller could otherwise append an arbitrary address
    and forge the sender. A complete answer must say the sender is taken from
    the last 20 bytes of calldata only when msg.sender is a trusted forwarder.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-2771

