    - transferFrom reverts unless 5% of the sale price has been paid to the receiver
    - The token contract deducts 5% of any value sent with a transfer and forwards it to the receiver
    - Marketplaces must escrow the royalty in the token contract before the transfer completes
  answer: A
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-2981

- id: erc-8004-registries
  type: multiple_choice
