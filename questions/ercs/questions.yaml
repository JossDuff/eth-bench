- id: erc-1155-uri-id-substitution
  type: open
  question: |
    An ERC-1155 contract's uri(id) returns "https://example.com/{id}.json" for
    every token. How must a client turn that into the URL for token ID 314592?
  answer: |
    The client replaces the literal substring {id} with the token ID rendered
    as hexadecimal, lowercase [0-9a-f], with no 0x prefix, left-padded with
    zeros to exactly 64 hex characters. For 314592 (0x4cce0) the URL is
    https://example.com/000000000000000000000000000000000000000000000000000000000004cce0.json.
    This lets one URI template serve all token types. A complete answer must
    state hex encoding, lowercase, no 0x prefix, and zero padding to 64
    characters (or produce the correct padded URL).
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-1155

- id: erc-1167-minimal-proxy
  type: multiple_choice
  question: |
    What does an ERC-1167 minimal proxy ("clone") do, and how is it
    implemented?
  choices:
    - It forwards every call and all gas to a fixed implementation address via DELEGATECALL and relays the return or revert data, using a 45-byte runtime bytecode with the address embedded in it
    - It forwards calls to an implementation via CALL so the implementation's storage is used
    - It stores the implementation address in an ERC-1967 storage slot and lets an admin upgrade it
    - It copies the implementation's runtime code into the clone at deployment time
  answer: A
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-1167

- id: erc-4337-paymaster-flow
  type: open
  question: |
    In ERC-4337, how does a paymaster sponsor a UserOperation, and how does the
    EntryPoint make sure the paymaster actually pays?
  answer: |
    A UserOperation names a paymaster in paymasterAndData. During validation the
    EntryPoint calls the paymaster's validatePaymasterUserOp, which checks
    whatever policy it likes (an off-chain signature, an ERC-20 balance to
    charge) and returns context plus validity data. The EntryPoint pays the
    bundler for gas out of a deposit the paymaster has previously placed in the
    EntryPoint, so the paymaster must prefund its deposit (and stake to use the
    shared mempool with less restricted validation). After execution the
    EntryPoint calls the paymaster's postOp with the actual gas cost so it can,
    for example, pull ERC-20 tokens from the user. A complete answer must say
    the paymaster is validated by the EntryPoint and pays from a deposit held
    in the EntryPoint, and mention postOp or the ability to charge the user in
    another token.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-4337

- id: erc-4337-initcode-deployment
  type: open
  question: |
    How does ERC-4337 let a user send their first UserOperation from a smart
    account that does not exist yet?
  answer: |
    The UserOperation carries a non-empty initCode field whose first 20 bytes
    are a factory contract address and whose remaining bytes are calldata for
    that factory. The EntryPoint calls the factory (through a SenderCreator
    helper) before validation, and the factory must deploy the account,
    typically with CREATE2 so its address is deterministic, and return an
    address equal to the UserOperation's sender or the operation fails. This
    counterfactual address can therefore receive funds before it is deployed,
    and the deployment gas is covered by the same operation (via
    verificationGasLimit). A complete answer must say the first 20 bytes of
    initCode are a factory that deploys the account and that the deployed
    address must match sender.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-4337

- id: erc-4337-two-dimensional-nonce
  type: multiple_choice
  question: |
    How is a UserOperation's nonce structured in ERC-4337 (EntryPoint v0.6 and
    later)?
  choices:
    - A 256-bit value split into a 192-bit key and a 64-bit sequence number, managed by the EntryPoint, so an account can have several independent nonce sequences at once
    - A plain 64-bit counter tracked in the account contract's own storage
    - A random 32-byte value that is marked used after execution, as in ERC-3009
    - It reuses the account's protocol-level account nonce
  answer: A
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-4337

- id: erc-6551-token-bound-accounts
  type: open
  question: |
    What does ERC-6551 provide, and how is the address of a token-bound account
    determined?
  answer: |
    ERC-6551 gives every ERC-721 token its own smart contract account (a
    token-bound account) that can hold assets and make calls, controlled by
    whoever owns the NFT, so the NFT can own things and act on chain. A
    permissionless singleton registry deploys the accounts as ERC-1167-style
    proxies using CREATE2, so the account address is computed
    deterministically from the implementation address, a salt, the chain ID,
    the token contract address, and the token ID. Because it is deterministic,
    the account exists counterfactually and can receive assets before it is
    deployed, and ownership follows the NFT when it is transferred. A complete
    answer must say each NFT gets a smart contract account controlled by the
    token's owner and that the address is derived deterministically (CREATE2)
    from the token's identity.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-6551

- id: erc-777-hooks-reentrancy
  type: open
  question: |
    Why did ERC-777 tokens cause reentrancy exploits in protocols that were
    safe with ERC-20 tokens? Give the classic example.
  answer: |
    ERC-777 adds tokensToSend and tokensReceived hooks: on every transfer the
    token calls back into the sender's and recipient's registered hook
    contracts (via the ERC-1820 registry) before and after moving the balance.
    A protocol written for ERC-20, where transfer is a plain balance update
    with no callback, may update its own accounting only after calling the
    token, so the tokensReceived or tokensToSend hook gives an attacker a
    re-entry point in the middle of the protocol's logic. The classic case is
    the April 2020 attacks on Uniswap V1 and dForce's Lendf.Me using imBTC, an
    ERC-777 token, where the hook was used to re-enter and drain funds. A
    complete answer must explain that ERC-777's transfer hooks call the
    recipient or sender mid-transfer, creating reentrancy that ERC-20
    integrations did not guard against, and ideally name imBTC or the Uniswap
    V1 / Lendf.Me incident.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-777

- id: erc-2535-diamonds
