- id: erc-7201-formula-rationale
  type: open
  question: |
    Why does the ERC-7201 formula hash twice, subtract one inside the outer
    hash, and clear the low byte of the result, rather than simply using
    keccak256(id) as the namespace root?
  answer: |
    Solidity and Vyper place mapping values and dynamic array data at
    keccak256-derived locations, so keccak256(id) could coincide with a slot the
    compiler already uses, and a namespace struct occupies several consecutive
    slots that would spill into keccak256(id) + n, which the compiler may also
    use. Subtracting one gives a location the standard layout never uses as a
    base, and hashing that again roots the namespace in a region disjoint from
    the default storage tree and from other namespaces, so consecutive slots
    cannot collide (assuming keccak collision resistance and reasonably sized
    arrays). Clearing the low 8 bits aligns the root to a 256-slot boundary,
    an anticipated optimization for a Verkle-style gas schedule where groups
    of 256 slots become warm together. A complete answer must explain that the
    construction avoids collisions with the compiler's keccak-derived storage
    locations (including the slots following the root) and that the mask
    aligns the namespace to 256 slots.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-7201

- id: erc-6492-wrapper-detection
