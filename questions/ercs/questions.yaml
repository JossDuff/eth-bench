- id: erc-1967-slot-minus-one
  type: open
  question: |
    ERC-1967 puts a proxy's implementation address at storage slot
    keccak256("eip1967.proxy.implementation") minus 1 instead of at the plain
    hash. Why subtract one?
  answer: |
    Solidity places mapping and dynamic array data at slots computed as
    keccak256 of known inputs (for example keccak256(key . slot)). A slot equal
    to a plain keccak256 output therefore has a known preimage, and an attacker
    or an unlucky layout could produce a collision with a mapping entry.
    Subtracting one yields a slot with no known keccak256 preimage, so no
    compiler-generated storage location can collide with it. The resulting slot
    is 0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc. A
    complete answer must say the subtraction removes the known hash preimage so
    the slot cannot collide with Solidity-computed mapping or array slots.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-1967

- id: erc-712-encoding-prefix
  type: multiple_choice
  question: |
    Under EIP-712, the digest that is signed is keccak256 of a two-byte prefix
    followed by the domain separator and hashStruct(message). What is the
    prefix?
  choices:
    - 0x1900
    - 0x1901
    - 0x1945
    - The bytes of "\x19Ethereum Signed Message:\n"
  answer: B
  difficulty: recall
  source: https://eips.ethereum.org/EIPS/eip-712

- id: erc-3009-vs-2612
  type: open
  question: |
    ERC-3009 (transferWithAuthorization) and ERC-2612 (permit) both let a token
    holder authorize a token movement with an EIP-712 signature. How do they
    differ?
  answer: |
    ERC-2612 signs an approval: it sets an allowance that is later spent through
    transferFrom, and it uses sequential per-owner nonces. ERC-3009 signs the
    transfer itself, moving tokens directly without touching the allowance
    mechanism, and it uses random 32-byte nonces so a user can have many
    authorizations outstanding at once without ordering failures. ERC-3009
    authorizations also carry a validity window (validAfter, validBefore), and
    receiveWithAuthorization requires the caller to be the payee to prevent
    front-running. USDC implements it. A complete answer must mention that
    3009 authorizes a direct transfer rather than an allowance and that it uses
    random rather than sequential nonces.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-3009

- id: erc-4626-inflation-attack
  type: open
  question: |
    Describe the "inflation" (first depositor) attack on an ERC-4626 vault and
    at least one way an implementation defends against it.
  answer: |
    When a vault is empty, an attacker deposits a tiny amount (for example 1
    wei) to mint 1 share, then donates a large amount of the underlying asset
    directly to the vault so one share is now worth a large sum. A victim's
    subsequent deposit smaller than the donation rounds down to zero shares (or
    far fewer than fair), and the attacker redeems their share for the victim's
    assets. Defences include virtual shares and assets (a decimals offset, as in
    OpenZeppelin's implementation) so the exchange rate cannot be manipulated
    cheaply, seeding the vault with an initial deposit whose shares are burned
    or locked, or reverting on deposits that would mint zero shares. A complete
    answer must describe the donation inflating the share price so a victim's
    deposit rounds to (near) zero shares, and name at least one mitigation.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-4626

- id: erc-4337-validation-data
  type: multiple_choice
  question: |
    In ERC-4337, an account's validateUserOp returns a uint256 called
    validationData. What does it pack?
  choices:
    - An authorizer address (or 0 for success, 1 for signature failure), a validUntil timestamp, and a validAfter timestamp
    - The gas actually used by validation and the account's next nonce
    - A boolean success flag and the paymaster address that will sponsor the operation
    - The keccak256 hash of the signature that was verified
  answer: A
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-4337

- id: erc-4337-banned-validation-opcodes
  type: open
  question: |
    ERC-4337's mempool rules (ERC-7562) forbid an account from using opcodes
    like TIMESTAMP, NUMBER, and BALANCE of other addresses during validation.
    Why?
  answer: |
    Bundlers simulate validateUserOp off-chain before including a UserOperation
    and are only paid if the operation succeeds on-chain. If validation depends
    on environment values that can change between simulation and inclusion
    (block time, block number, another account's balance, another contract's
    storage), an attacker can craft operations that pass simulation and then
    fail on-chain, making bundlers waste gas and enabling denial of service on
    the shared mempool. Restricting validation to deterministic inputs (the
    account's own storage, the signature, its own nonce) makes simulation
    results reliable so operations can be safely propagated without trust.
    A complete answer must connect the restriction to keeping off-chain
    simulation results valid at inclusion time so bundlers are not griefed.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-7562

- id: erc-2981-enforcement
  type: multiple_choice
