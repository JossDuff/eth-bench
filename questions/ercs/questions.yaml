- id: erc-3668-nested-lookup-sender-check
  type: open
  question: |
    A CCIP-Read-aware contract A calls contract B, which might revert with
    OffchainLookup. What does ERC-3668 require A to do with such a revert, and
    what problem does that requirement prevent?
  answer: |
    A must catch any OffchainLookup error from the callee rather than letting
    Solidity bubble it up. It must check that the error's sender field equals
    B's address and revert with a different error if it does not. If it
    matches, A may support nesting by reverting with its own OffchainLookup
    whose sender is A, reusing B's urls and callData, pointing callbackFunction
    at a callback on A, and packing B's address, callback selector, and
    extraData into A's extraData so the callback can forward the gateway
    response to B. Bubbling is forbidden because a non-CCIP-aware
    intermediate contract could re-enter A, causing A to revert with an
    OffchainLookup that propagates all the way out: the client would see
    sender equal to A and treat it as valid, but completing it would only
    finish the inner nested invocation. A complete answer must mention
    catching the error and checking that sender matches the callee, and that
    reverts must not simply be bubbled up.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-3668

