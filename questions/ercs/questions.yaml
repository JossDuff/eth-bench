- id: erc-4626-preview-redeem-ignores-limits
  type: open
  question: |-
    An ERC-4626 vault temporarily blocks withdrawals, so maxRedeem(owner)
    returns 0. The owner holds 100 shares, whose redemption would yield
    200 assets after fees if withdrawals were enabled. Assume the conversion
    rate and fees remain unchanged. What should previewRedeem(100) return:
    0, 200, or a revert caused by the withdrawal restriction?
  answer: |-
    It should return 200. ERC-4626 requires previewRedeem to ignore redemption
    limits such as those reported by maxRedeem and act as though the redemption
    would be accepted. A complete answer must give 200 and explain that the
    withdrawal restriction does not constrain the preview.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-4626
- id: erc-7540-async-deposit-preview-behavior
  type: open
  question: |-
    For an ERC-7540 vault implementing asynchronous deposits, how must
    previewDeposit and previewMint behave, even when some deposit requests
    are already claimable?
  answer: |-
    Both functions must revert for all callers and inputs. Claimable requests
    do not create an exception to the asynchronous-deposit preview rule.
    A complete answer must state that both previewDeposit and previewMint
    revert; it need not discuss asynchronous withdrawals.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-7540
