- id: erc-5564-stealth-private-key-derivation
  type: open
  question: |
    In ERC-5564's secp256k1 scheme, how does a recipient derive the private
    key for a stealth address that was announced to them?
  answer: |
    The recipient computes the shared secret s as their viewing private key
    multiplied by the announced ephemeral public key (the sender computed the
    same point as ephemeral private key times viewing public key), hashes it
    to s_h, and derives the stealth private key as p_stealth = p_spend + s_h
    modulo the curve order. This matches the stealth public key
    P_stealth = P_spend + s_h * G that the sender derived. A complete answer
    must mention the ECDH shared secret from the viewing key and ephemeral
    public key, hashing it, and adding the hash to the spending private key.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-5564

