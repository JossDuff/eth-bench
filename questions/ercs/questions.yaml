- id: erc-7562-associated-storage
  type: open
  question: |
    ERC-7562 lets an unstaked ERC-4337 account read and write its own storage
    during validation and also storage in other contracts that is
    "associated" with the account's address. What exactly makes a storage slot
    in another contract associated with address A?
  answer: |
    Either the slot's value is A itself, or the slot's location was computed
    as keccak256(A || x) + n, where x is a bytes32 value and n is in the range
    0 to 128. This covers Solidity mapping entries keyed by the account
    address (mapping(address => ...)) and the fields of a struct stored at
    such an entry, which is what lets a token or other non-entity contract
    keep per-account data readable in validation without staking. A complete answer must give
    the keccak256(A || x) + n form with the bounded offset, or at minimum
    describe mapping slots keyed by the account's address plus a small
    offset range.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-7562

