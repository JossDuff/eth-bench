- description: ercs/erc-3009-vs-2612
  vars:
    type: open
    question: |-
      ERC-3009 (transferWithAuthorization) and ERC-2612 (permit) both let a token
      holder authorize a token movement with an EIP-712 signature. How do they
      differ?
    answer: |-
      ERC-2612 signs an approval: it sets an allowance that is later spent through
      transferFrom, and it uses sequential per-owner nonces. ERC-3009 signs the
      transfer itself, moving tokens directly without touching the allowance
      mechanism, and it uses random 32-byte nonces so a user can have many
      authorizations outstanding at once without ordering failures. ERC-3009
      authorizations also carry a validity window (validAfter, validBefore), and
      receiveWithAuthorization requires the caller to be the payee to prevent
      front-running. USDC implements it. A complete answer must mention that
      3009 authorizes a direct transfer rather than an allowance and that it uses
      random rather than sequential nonces.
  metadata:
    section: ercs
    type: open
    difficulty: understanding
    source: https://eips.ethereum.org/EIPS/eip-3009
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: ercs

- description: ercs/erc-4626-inflation-attack
  vars:
    type: open
    question: |-
      Describe the "inflation" (first depositor) attack on an ERC-4626 vault and
      at least one way an implementation defends against it.
    answer: |-
      When a vault is empty, an attacker deposits a tiny amount (for example 1
      wei) to mint 1 share, then donates a large amount of the underlying asset
      directly to the vault so one share is now worth a large sum. A victim's
      subsequent deposit smaller than the donation rounds down to zero shares (or
      far fewer than fair), and the attacker redeems their share for the victim's
      assets. Defences include virtual shares and assets (a decimals offset, as in
      OpenZeppelin's implementation) so the exchange rate cannot be manipulated
      cheaply, seeding the vault with an initial deposit whose shares are burned
      or locked, or reverting on deposits that would mint zero shares. A complete
      answer must describe the donation inflating the share price so a victim's
      deposit rounds to (near) zero shares, and name at least one mitigation.
  metadata:
    section: ercs
    type: open
    difficulty: reasoning
    source: https://eips.ethereum.org/EIPS/eip-4626
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: ercs

