- id: erc-20-insufficient-balance-should-not-must
  type: open
  question: |
    Does the ERC-20 standard require a token's transfer function to revert
    when the caller's balance is insufficient? What does that imply for
    contracts that call transfer?
  answer: |
    No. The specification says transfer SHOULD throw if the caller lacks
    sufficient balance; it is not a MUST. A compliant token may instead
    return false (the only hard requirements are the bool return and firing
    Transfer on success). Because of this, the standard states that callers
    MUST handle a false return value and MUST NOT assume false is never
    returned, which is why integrators wrap calls with safeTransfer-style
    checks. A complete answer must say that reverting is a SHOULD rather than
    a MUST and that callers must check the boolean return value.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-20
