  answer: A
  difficulty: recall
  source: https://eips.ethereum.org/EIPS/eip-6492

- id: erc-6492-verification-order
  type: open
  question: |
    In what order must an ERC-6492 verifier apply its checks when validating a
    signature for an address, and why must the wrapper check come first?
  answer: |
    First, if the signature ends with the ERC-6492 magic bytes, unwrap it,
    perform the factory deployment call (typically inside an eth_call to a
    multicall or universal validator contract) if the account has no code yet,
    then call isValidSignature with the inner signature. Second, if the
    address has code, perform ordinary ERC-1271 verification; if that fails
    and the deploy step was skipped because code already existed, execute the
    wrapped factory or prepare call and retry isValidSignature. Third, only if
    there is no code at the address, fall back to ecrecover. The wrapper check
    must precede the ERC-1271 check so that a counterfactual signature stays
    valid after the contract is deployed, and must precede ecrecover so a
    wrapped contract signature is never misinterpreted as an EOA signature.
    ecrecover must never run before ERC-1271 because a contract's signature
    format may also be a valid EOA signature for some other address. A
    complete answer must give the order magic bytes, then ERC-1271, then
    ecrecover, and state that checking the wrapper first keeps counterfactual
    signatures valid after deployment.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-6492

