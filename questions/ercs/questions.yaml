      metric: ercs

- description: ercs/erc-712-struct-array-field-encoding
  vars:
    type: open
    question: |-
      Under EIP-712, consider the types Item(string label,uint256 amount) and
      Basket(Item[] items). A Basket contains exactly two items, and their
      EIP-712 hashStruct values are h0 and h1, each 32 bytes. What exact byte
      sequence is hashed to produce the 32-byte encoding of the items field?
      Does that sequence contain an ABI array offset or length?
    answer: |-
      The field is encoded as keccak256(h0 || h1): the hashed byte sequence is
      exactly the 64-byte concatenation of the two hashStruct values, in array
      order. It contains neither an ABI offset nor an array length.
      A complete answer must specify this concatenation and exclude offset and
      length words. It need not expand the individual Item hashes.
  metadata:
    section: ercs
    type: open
    difficulty: reasoning
    source: https://eips.ethereum.org/EIPS/eip-712
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: ercs

