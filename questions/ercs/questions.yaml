    for a not-yet-deployed contract signer?
  choices:
    - The signature ends with the 32 magic bytes 0x6492649264926492649264926492649264926492649264926492649264926492
    - The signature begins with the bytes 0x6492
    - The signature is exactly 84 bytes, a 64-byte signature plus a 20-byte factory address
