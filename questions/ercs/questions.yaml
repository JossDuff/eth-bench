- description: ercs/erc-1155-uri-id-substitution
  vars:
    type: open
    question: |-
      An ERC-1155 contract's uri(id) returns "https://example.com/{id}.json" for
      every token. How must a client turn that into the URL for token ID 314592?
    answer: |-
      The client replaces the literal substring {id} with the token ID rendered
      as hexadecimal, lowercase [0-9a-f], with no 0x prefix, left-padded with
      zeros to exactly 64 hex characters. For 314592 (0x4cce0) the URL is
      https://example.com/000000000000000000000000000000000000000000000000000000000004cce0.json.
      This lets one URI template serve all token types. A complete answer must
      state hex encoding, lowercase, no 0x prefix, and zero padding to 64
      characters (or produce the correct padded URL).
  metadata:
    section: ercs
    type: open
    difficulty: understanding
    source: https://eips.ethereum.org/EIPS/eip-1155
  assert:
    - type: llm-rubric
