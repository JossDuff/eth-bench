- description: ercs/erc-165-invalid-interface-probe
  vars:
    type: open
    question: |-
      A contract's supportsInterface function returns true for both 0x01ffc9a7
      and 0xffffffff, with both probes succeeding within ERC-165's gas limit.
      Under ERC-165's detection procedure, should a caller classify this
      contract as supporting ERC-165? Explain the decisive check.
    answer: |-
      No. ERC-165 detection requires a successful true result for 0x01ffc9a7
      and a successful false result for 0xffffffff. Returning true for the
      invalid interface identifier fails the detection procedure.
      A complete answer must reject ERC-165 support and identify the true result
      for 0xffffffff as the reason.
  metadata:
    section: ercs
    type: open
    difficulty: understanding
    source: https://eips.ethereum.org/EIPS/eip-165
  assert:
    - type: llm-rubric
