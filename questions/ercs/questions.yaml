- description: ercs/erc-1155-batch-callback-balance-order
  vars:
    type: open
    question: |-
      An ERC-1155 holder has 10 units of token ID 7. A distinct receiver contract
      initially has none. A successful safeBatchTransferFrom sends IDs [7, 7]
      with amounts [3, 4] to that receiver. At the start of
      onERC1155BatchReceived, before the receiver performs any further calls,
      what balances must balanceOf report for the holder and receiver for ID 7?
      Explain the ordering requirement.
    answer: |-
      The holder must have 3 units and the receiver must have 7 units. All balance
      changes for the batch must be applied before the receiver hook is called,
      including both entries for the repeated token ID. A complete answer must
      give both balances and state that the hook runs after the batch's balance
      updates, not between entries or before the updates.
  metadata:
    section: ercs
    type: open
    difficulty: reasoning
    source: https://eips.ethereum.org/EIPS/eip-1155
  assert:
    - type: llm-rubric
