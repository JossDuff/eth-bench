- id: erc-7201-namespace-slot-formula
  type: multiple_choice
  question: |
    ERC-7201 defines the formula identified by "erc7201" for deriving the root
    storage slot of a namespace from its string id. What is it?
  choices:
    - keccak256(keccak256(id) - 1) & ~0xff
    - keccak256(id) - 1
    - keccak256(keccak256(id)) - 1
    - keccak256(id) & ~0xff
  answer: A
