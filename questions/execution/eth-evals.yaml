- description: execution/gas-k-08
  vars:
    type: multiple_choice
    question: |-
      The total fee a user pays for a transaction on an optimistic or ZK rollup is made up of which two cost components?
    choices:
      - Storage rent plus compute credits
      - Priority tip plus MEV auction fee
      - L2 execution gas plus L1 data gas (data availability)
      - Sequencer subscription plus validator staking fee
    answer: C
  metadata:
    section: execution
    type: multiple_choice
    difficulty: understanding
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-gas.jsonl
    tags:
      - eth-evals
      - gas
  assert:
    - type: regex
      value: 'ANSWER:\W*{{answer}}\b(?!\s*,\s*[A-H]\b)'
      metric: execution

