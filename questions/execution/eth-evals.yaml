- description: execution/gas-k-06
  vars:
    type: open
    question: |-
      EIP-7935, part of the Fusaka upgrade (December 2025), coordinated client defaults toward what mainnet block gas limit? Answer in millions of gas.
      End your reply with a line of the form "Answer: <integer>".
    answer: |-
      Any of the following counts as correct: The response's final answer must be the integer 60 (decimal or the equivalent hex). OR The response's final answer must be the integer 60000000 (decimal or the equivalent hex).. Reference from ethskills: "**Fusaka (Dec 2025):** PeerDAS (nodes sample 1/8 of data) + 2x gas limit (30M→60M)." Grade INCORRECT for these tempting wrong answers: `Answer: 30`; `Answer: 45`
  metadata:
    section: execution
    type: open
    difficulty: recall
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-gas.jsonl
    tags:
      - eth-evals
      - gas
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: execution

- description: execution/gas-k-07
  vars:
    type: open
    question: |-
      Under PeerDAS (shipped in Ethereum's Fusaka upgrade), each node samples what fraction of blob data instead of downloading all of it?
      End your reply with a line of the form "Answer: <fraction>".
    answer: |-
      The response's answer must match the pattern `1\s*/\s*8|one[\s-]?eighth|12\.5\s*%` (that is, it must name the concept the pattern captures). The reference answer is: Answer: 1/8. Reference from ethskills: "**Fusaka (Dec 2025):** PeerDAS (nodes sample 1/8 of data) + 2x gas limit (30M→60M)."
  metadata:
    section: execution
