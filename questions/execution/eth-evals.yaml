- description: execution/derivations-c2finish-02
  vars:
    type: open
    question: |-
      In a CREATE2 derivation, keccak256(0xff ++ deployer ++ salt ++ keccak256(init_code)) evaluates to:
      0xa52ecc02bbc9d231fbf91c4159c95b39661eb83fb524230f1a2e10ebddaad12a

      What address is the contract deployed at?

      Answer with only the address (any casing).
    answer: |-
      The response's final answer must be exactly `0x59c95b39661eb83fb524230f1a2e10ebddaad12a` (case-insensitive). Grade INCORRECT for these tempting wrong answers: `0xa52ecc02bbc9d231fbf91c4159c95b39661eb83fb524230f1a2e10ebddaad12a`
  metadata:
    section: execution
    type: open
    difficulty: reasoning
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/gen-derivations.jsonl
    tags:
      - eth-evals
      - derivations
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: execution

- description: execution/gas-intrinsic-02
  vars:
    type: open
    question: |-
      A simple value-transfer transaction to an EOA carries this calldata:
      0x00a600760060fd8545da0000004000d2c80000c000930000d4b50011

      Using EIP-2028 calldata pricing (ignore the EIP-7623 floor and access lists), what is the transaction's intrinsic gas?

      End your reply with a line of the form "Answer: <integer>".
    answer: |-
      The response's final answer must be the integer 21292 (decimal or the equivalent hex).
  metadata:
    section: execution
    type: open
    difficulty: reasoning
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/gen-gas.jsonl
    tags:
      - eth-evals
      - gas
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: execution

- description: execution/gas-basefee-01
  vars:
    type: open
    question: |-
      An EIP-1559 chain has a gas target of 15,000,000 per block. The base fee entering block 1 is 1400000000 wei.
      Blocks execute as follows:
      - block 1: 30,000,000 gas used
      - block 2: 15,000,000 gas used

      Using the exact EIP-1559 integer update rule, what is the base fee (in wei) entering the block AFTER the last one listed?

      End your reply with a line of the form "Answer: <integer>".
    answer: |-
      The response's final answer must be the integer 1575000000 (decimal or the equivalent hex).
  metadata:
    section: execution
    type: open
    difficulty: reasoning
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/gen-gas.jsonl
    tags:
      - eth-evals
      - gas
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: execution

