- description: execution/gas-k-01
  vars:
    type: open
    question: |-
      How much gas does a simple ETH value transfer (plain send to an EOA, empty calldata) consume on Ethereum?
      End your reply with a line of the form "Answer: <integer>".
    answer: |-
      The response's final answer must be the integer 21000 (decimal or the equivalent hex). Reference from ethskills: "| ETH transfer | 21,000 | **$0.004** | $0.04 | $0.42 |"
  metadata:
    section: execution
    type: open
    difficulty: recall
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-gas.jsonl
    tags:
      - eth-evals
      - gas
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: execution

- description: execution/gas-k-03
  vars:
    type: open
    question: |-
      The Ethereum network upgrade of March 2024 that activated blob transactions (EIP-4844) is commonly known by what name?
      End your reply with a line of the form "Answer: <upgrade name>".
    answer: |-
      The response's answer must match the pattern `dencun|cancun` (that is, it must name the concept the pattern captures). The reference answer is: Answer: Dencun. Reference from ethskills: "**EIP-4844 (Dencun, March 2024):** Blob transactions — L2s post data as blobs instead of calldata, 100x cheaper."
  metadata:
    section: execution
    type: open
    difficulty: recall
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-gas.jsonl
    tags:
      - eth-evals
      - gas
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: execution

- description: execution/gas-k-04
  vars:
    type: open
    question: |-
      After EIP-4844, rollups post their batch data to Ethereum as blobs. Before that, which part of a regular transaction did rollups use to post that data (roughly 100x more expensive)?
      End your reply with a line of the form "Answer: <term>".
    answer: |-
      The response's answer must match the pattern `call\s?-?data` (that is, it must name the concept the pattern captures). The reference answer is: Answer: calldata. Reference from ethskills: "**EIP-4844 (Dencun, March 2024):** Blob transactions — L2s post data as blobs instead of calldata, 100x cheaper."
  metadata:
    section: execution
    type: open
    difficulty: recall
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-gas.jsonl
    tags:
      - eth-evals
      - gas
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: execution

