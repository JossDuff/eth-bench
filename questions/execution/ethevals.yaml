- description: execution/transactions-10-read-a-receipt
  vars:
    type: multiple_choice
    question: |-
      A user deposited into a vault. The transaction receipt shows status 0x1, gasUsed 51203, and the user's share balance now reads zero. What does status 0x1 actually guarantee?
    choices:
      - |-
        The transaction executed to completion without reverting — nothing more; the outcome has to be read from the logs and state
      - Every internal call inside the transaction succeeded
      - The funds were credited to the sender
      - The deposit did what the user intended; the balance read must be stale
    answer: A
  metadata:
    section: execution
    type: multiple_choice
    difficulty: understanding
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/transactions/transactions-10-read-a-receipt.yaml
    tags:
      - ethevals
      - transactions
  assert:
    - type: javascript
      value: file://src/multiple_choice.js
      metric: execution

- description: execution/transactions-11-internal-transactions
  vars:
    type: multiple_choice
    question: |-
      A block explorer lists several "internal transactions" under one transaction hash, each moving ETH between contracts. What are they?
    choices:
      - |-
        Value-carrying message calls made during the transaction's execution, reconstructed by tracing the EVM; they are not signed, have no hash of their own, and never appear in the block's transaction list
      - Separate transactions the contract signed and broadcast during execution
      - Pending transactions queued by the contract for a later block
      - Log events emitted with the Transfer signature
    answer: A
  metadata:
    section: execution
    type: multiple_choice
    difficulty: understanding
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/transactions/transactions-11-internal-transactions.yaml
    tags:
      - ethevals
      - transactions
  assert:
    - type: javascript
      value: file://src/multiple_choice.js
      metric: execution

- description: execution/transactions-12-effective-gas-price
  vars:
    type: open
    question: |-
      A type-2 transaction sets maxFeePerGas = 50 gwei and maxPriorityFeePerGas = 2 gwei. It is included in a block whose base fee is 30 gwei. What effective gas price, in gwei, does the sender pay per unit of gas?
      End your reply with a line of the form "Answer: <integer>".
    answer: |-
      The response's final answer must be the integer 32 (decimal or the equivalent hex). Grade INCORRECT for these tempting wrong answers: `Answer: 50`; `Answer: 30`; `Answer: 52`
  metadata:
    section: execution
    type: open
    difficulty: reasoning
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/transactions/transactions-12-effective-gas-price.yaml
    tags:
      - ethevals
      - transactions
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: execution

- description: execution/transactions-13-nonce-replacement
  vars:
    type: multiple_choice
    question: |-
      Your transaction with nonce 41 has been pending for an hour at a fee far below the current base fee. You want it gone. What do you send?
    choices:
      - A cancel request to the RPC node that holds it
      - |-
        A transaction with the same nonce 41 (for example 0 ETH to yourself) with maxFeePerGas and maxPriorityFeePerGas raised by at least ~10% over the stuck one; whichever nonce-41 transaction is included first replaces the other
      - |-
        A new transaction with nonce 42 at a high fee; the stuck one is dropped once it is skipped
      - Nothing; pending transactions expire after 30 minutes
    answer: B
  metadata:
    section: execution
    type: multiple_choice
    difficulty: understanding
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/transactions/transactions-13-nonce-replacement.yaml
    tags:
      - ethevals
      - transactions
  assert:
    - type: javascript
      value: file://src/multiple_choice.js
      metric: execution

