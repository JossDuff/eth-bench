- description: execution/transactions-21-decode-raw-tx
  vars:
    type: open
    question: |-
      A wallet is handed this signed raw transaction to broadcast:

      0x02f8720182031184773594008477359400809470997970c51812dc3a010c7d01b50e0d17dc79c8880de0b6b3a764000080c001a0ce18214ff9d06ecaacb61811f9d6dc2be922e8cebddeaf6df0b30d5c498f6d33a05f0487c6dbbf2139f7c705d8054dbb16ecac8ae6256ce2c4c6f2e7ef35b3a496

      Decode it. Reply with JSON only:
      {"type": <transaction type as an integer>, "chainId": <integer>, "nonce": <integer>, "to": "<address>", "valueWei": <integer>, "maxFeePerGas": <integer, wei>, "maxPriorityFeePerGas": <integer, wei>, "from": "<the sender address, recovered from the signature>"}
    answer: |-
      The response must give a JSON object matching {"type": 2, "chainId": 1, "nonce": 785, "to": "0x70997970C51812dc3A010C7d01b50e0d17dc79C8", "valueWei": 1000000000000000000, "maxFeePerGas": 2000000000, "maxPriorityFeePerGas": 2000000000, "from": "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"} (other keys may be present). Grade INCORRECT for these tempting wrong answers: `{"type": 2, "chainId": 1, "nonce": 785, "to": "0x70997970C51812dc3A010C7d01b50e0d17dc79C8", "valueWei": 1000000000000000000, "maxFeePerGas": 2000000000, "maxPriorityFeePerGas": 2000000000, "from": "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"}`; `{"type": 2, "chainId": 1, "nonce": 311, "to": "0x70997970C51812dc3A010C7d01b50e0d17dc79C8", "valueWei": 1000000000000000000, "maxFeePerGas": 2000000000, "maxPriorityFeePerGas": 2000000000, "from": "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"}`
  metadata:
    section: execution
    type: open
    difficulty: reasoning
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/transactions/transactions-21-decode-raw-tx.yaml
    tags:
      - ethevals
      - transactions
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: execution

