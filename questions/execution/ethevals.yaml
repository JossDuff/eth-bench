- description: execution/transactions-23-serialize-zero-tx
  vars:
    type: open
    question: |-
      Serialize, unsigned and ready for hashing, an EIP-1559 transaction with these fields: chainId 1, nonce 0, maxPriorityFeePerGas 0, maxFeePerGas 0, gasLimit 0, to 0x70997970C51812dc3A010C7d01b50e0d17dc79C8, value 0, empty data, empty access list. Give the exact typed-envelope bytes as one hex string.
      End your reply with a line of the form "Answer: 0x<hex>".
