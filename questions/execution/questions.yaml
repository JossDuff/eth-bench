- description: execution/execution-tstore-gas-stipend-sentry
  vars:
    type: open
    question: |-
      Under Cancun's EIP-1153 rules, a non-static call frame has exactly
      2300 gas remaining immediately before executing TSTORE, with both
      operands already on the stack. Does TSTORE fail because of a
      storage-write gas-stipend check?
    answer: |-
      No. TSTORE is not subject to SSTORE's check that rejects execution when
      gasleft is less than or equal to 2300. TSTORE costs 100 gas, so the
      specified frame has enough gas to execute it. A complete answer must
      state that the stipend-based SSTORE restriction does not apply to TSTORE.
  metadata:
    section: execution
    type: open
    difficulty: understanding
    source: https://eips.ethereum.org/EIPS/eip-1153
