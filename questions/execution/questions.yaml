- description: execution/execution-extcodehash-nonexistent-vs-empty-code
  vars:
    type: open
    question: |-
      A contract calls EXTCODEHASH on two addresses: one that has never been
      touched (no balance, no nonce, no code) and one that is an ordinary EOA
      holding 1 ETH. What does it get for each, and why do they differ?
    answer: |-
      For the untouched address EXTCODEHASH returns 0, because the account does
      not exist in the state. For the EOA holding ETH it returns
      keccak256 of the empty byte string,
      0xc5d2460186f7233c927e7db2dcc703c0e500b653ca82273b7bfad8045d85a470,
      because the account exists (it has a balance) but its code is empty.
      EIP-1052 specifies this distinction so that contracts can tell "no account"
      from "an account with no code". A complete answer must give 0 for the
      non-existent account and the hash of empty code for the existing EOA.
  metadata:
    section: execution
    type: open
    difficulty: reasoning
    source: https://eips.ethereum.org/EIPS/eip-1052
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: execution

