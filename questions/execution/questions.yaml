- description: execution/execution-reverted-callee-access-warmth
  vars:
    type: open
    question: |-
      Under Berlin's EIP-2929 rules, contract A calls an initially cold contract
      B. B executes SLOAD on an initially cold storage slot and then executes
      REVERT. A catches the failure and calls B again in the same transaction.
      No other operation accesses B or that slot. For the second call, what
      are the account-access gas charge for CALL's target B and the gas charge
      for B's first SLOAD of that slot? Explain the difference, excluding all
      other CALL costs.
    answer: |-
      The second CALL's target-account access costs 100 gas because B was
      added to the accessed-address set in A's scope before entering B.
      B's first SLOAD on the second call costs 2100 gas because the storage
      access added inside the reverted callee scope was rolled back.
      A complete answer must give both charges and explain that the callee's
      reverted storage warming is undone while the caller's warming of the
      CALL target remains.
  metadata:
    section: execution
    type: open
    difficulty: reasoning
    source: https://eips.ethereum.org/EIPS/eip-2929
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: execution

- description: execution/execution-transient-delegatecall-revert-rollback
  vars:
    type: open
    question: |-
      Under Cancun's EIP-1153 rules, contract A executes TSTORE(7, 5), then
      DELEGATECALLs contract B. B executes TSTORE(7, 9) and then REVERTs.
      A catches the failure and executes TLOAD(7), with no intervening writes.
      What value does A read, and why?
    answer: |-
      A reads 5. During DELEGATECALL, B operates on A's transient storage,
      but the write of 9 is rolled back when the delegated frame reverts.
      A's earlier write of 5 precedes that frame and remains intact.
      A complete answer must give 5 and explain both the shared transient
      storage context and rollback of the delegated frame's write.
  metadata:
    section: execution
    type: open
    difficulty: reasoning
    source: https://eips.ethereum.org/EIPS/eip-1153
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: execution

