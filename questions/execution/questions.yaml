- description: execution/execution-blob-fee-destination
  vars:
    type: open
    question: |-
      A type-3 (blob) transaction pays both execution gas and blob gas. Where does
      the blob fee go, and can a sender pay a priority fee on blob gas?
    answer: |-
      The blob fee (blob gas used times the blob base fee) is burned in full, just
      like the EIP-1559 execution base fee. There is no priority fee for blob gas:
      the transaction specifies only max_fee_per_blob_gas, which must be at least
      the current blob base fee for the transaction to be valid, and the sender
      pays exactly the blob base fee, with nothing going to the proposer or
      builder for blobs. Any tip to the block producer comes only through the
      execution gas priority fee. A complete answer must say the blob fee is
      burned and that there is no blob priority fee.
  metadata:
    section: execution
    type: open
    difficulty: understanding
    source: https://eips.ethereum.org/EIPS/eip-4844
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: execution

- description: execution/execution-eip3607-sender-with-code
  vars:
    type: open
    question: |-
      What does EIP-3607 (London) forbid, why was it introduced, and how did
      EIP-7702 have to modify it?
    answer: |-
      EIP-3607 makes a transaction invalid if the sender address has deployed
      code. It was introduced because a contract address collision (for example
      through a CREATE2 address someone also holds a private key for, or a future
      break of the 160-bit address space) would otherwise let the key holder move
      funds out of a contract by sending transactions from its address; rejecting
      such transactions closes the loophole. EIP-7702 had to carve out an
      exception: an EOA whose code is exactly a delegation indicator
      (0xef0100 followed by an address) is still allowed to originate
      transactions, otherwise delegated EOAs could never send transactions
      again. A complete answer must say senders with code cannot send
      transactions (to protect against address collisions) and that 7702 exempts
      delegation-indicator code.
  metadata:
    section: execution
    type: open
    difficulty: understanding
    source: https://eips.ethereum.org/EIPS/eip-3607
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: execution

