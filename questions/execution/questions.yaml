- id: execution-sstore-cold-then-dirty
  type: open
  question: |
    Within one transaction, a contract first writes a non-zero value to a
    storage slot whose value is zero and which has not been accessed yet in
    this transaction. Later in the same transaction it writes a different
    non-zero value to the same slot. How much gas does each SSTORE cost?
  answer: |
    The first SSTORE costs 22,100 gas: 2,100 for the cold storage access
    (EIP-2929) plus 20,000 for setting a zero slot to a non-zero value. The
    second costs 100 gas: the slot is now warm and already "dirty" (its current
    value differs from its original value at the start of the transaction), so
    under EIP-2200 net gas metering the write is charged only the warm access
    cost (WARM_STORAGE_READ_COST). A complete answer must give 22,100 for the
    first write and 100 for the second, or explain the cold-plus-set and
    dirty-slot pricing that produce them.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-2929

