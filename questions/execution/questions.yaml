- id: execution-staticcall-restrictions
  type: open
  question: |
    A contract is invoked via STATICCALL. Which operations will cause its
    execution to fail, and how does the EVM treat a CALL with zero value made
    from within that static context?
  answer: |
    In a static context any state-modifying operation causes an exceptional
    halt: SSTORE, TSTORE, LOG0 to LOG4, CREATE and CREATE2, SELFDESTRUCT, and
    CALL with a non-zero value. Nested calls (CALL with zero value,
    DELEGATECALL, STATICCALL) are allowed, but the static flag is inherited, so
    every frame beneath the STATICCALL is also read-only. Reads such as SLOAD,
    BALANCE, and returning data are fine. A complete answer must name the
    state-changing operations that fail (at least SSTORE and LOG or CREATE or
    value-transferring CALL) and say the restriction propagates to nested calls.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-214

