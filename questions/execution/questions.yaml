- id: execution-withdrawals-processing
  type: open
  question: |
    How are beacon chain withdrawals applied on the execution layer since
    Shanghai (EIP-4895)? Are they transactions, and what happens if the
    recipient is a contract?
  answer: |
    Withdrawals are not transactions. Each block carries a list of withdrawal
    objects (index, validator index, address, amount in gwei) committed to by
    the header's withdrawalsRoot, and the execution layer applies them as
    unconditional balance increases after the block's transactions, with no gas
    charged and no EVM execution. Because no code runs, a contract recipient
    cannot reject or react to the withdrawal; its balance simply increases even
    if it has no payable function, and there is no way for the withdrawal to
    fail or be reverted. A complete answer must say withdrawals are
    system-level balance credits rather than transactions, and that no code
    executes on the recipient.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-4895
