- description: execution/evm-call-vs-delegatecall
  vars:
    type: open
    question: What is the difference between CALL and DELEGATECALL?
    answer: |-
      CALL executes the target contract's code in the target's own context: the
      target's storage is used, msg.sender becomes the calling contract, and any
      value sent is transferred to the target. DELEGATECALL executes the target's
      code in the caller's context: the caller's storage is read and written,
      msg.sender and msg.value are preserved from the original call, and no value
      is transferred. A complete answer must state that DELEGATECALL runs the
      callee's code against the caller's storage and preserves msg.sender.
  metadata:
    section: execution
    type: open
    difficulty: understanding
    source: https://eips.ethereum.org/EIPS/eip-7
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: execution

