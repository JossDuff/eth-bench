- id: execution-selfdestruct-after-cancun
  type: open
  question: |
    If a contract calls SELFDESTRUCT after the Cancun upgrade, is its storage
    actually deleted?
  answer: |
    Only if the contract was created in the same transaction. Since EIP-6780
    (Cancun), SELFDESTRUCT always transfers the contract's entire ETH balance to
    the named beneficiary, but code and storage are deleted only when the
    contract is in the set of accounts created during the current transaction.
    Otherwise the contract remains with its code and storage intact and only its
    balance moves. A complete answer must say storage is deleted only when the
    contract was created in the same transaction, and that otherwise only the
    balance is transferred.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-6780

- id: execution-blob-gas-price-formula
  type: open
  question: |
    How does the execution layer turn excess blob gas into a blob base fee?
  answer: |
    The blob base fee is an exponential function of excess blob gas: roughly
    MIN_BLOB_BASE_FEE multiplied by e raised to (excess_blob_gas /
    BLOB_BASE_FEE_UPDATE_FRACTION). Because the protocol cannot use floating
    point, the spec evaluates this with an integer Taylor series approximation
    (called fake_exponential or taylor_exponential in the specs). Excess blob gas
    itself accumulates the difference between blob gas used and the target across
    blocks, so sustained demand above target raises the fee exponentially and
    demand below target lowers it. A complete answer must say the price is
    exponential in excess blob gas and computed with integer arithmetic.
  difficulty: reasoning
  source: https://eips.ethereum.org/EIPS/eip-4844

