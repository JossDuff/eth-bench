- description: execution/execution-max-fee-balance-requirement
  vars:
    type: open
    question: |-
      A type-2 transaction sets max_fee_per_gas to 100 gwei, max_priority_fee_per_gas
      to 1 gwei, gas_limit to 1,000,000, and value to 0. The current base fee is
      10 gwei. The sender's balance is 0.05 ETH. Is the transaction valid, and
      why?
    answer: |-
      It is invalid. Validity requires the sender's balance to cover gas_limit
      times max_fee_per_gas plus value, which is 1,000,000 * 100 gwei = 0.1 ETH,
      regardless of the fact that the effective price would only be 11 gwei
      (base fee plus tip) and the transaction would actually cost at most 0.011
      ETH. The protocol checks against the maximum the sender has agreed to pay,
      not the price it will actually pay. A complete answer must say the balance
      is checked against gas_limit times max_fee_per_gas (0.1 ETH here), so the
      transaction is rejected.
  metadata:
    section: execution
    type: open
    difficulty: reasoning
    source: https://eips.ethereum.org/EIPS/eip-1559
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: execution

