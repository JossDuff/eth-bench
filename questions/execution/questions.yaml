- description: execution/execution-revert-vs-exceptional-halt
  vars:
    type: open
    question: |-
      A callee stops either by executing REVERT or by hitting an exceptional halt
      such as the INVALID opcode or running out of gas. Both undo the callee's
      state changes. How do they differ from the caller's point of view?
    answer: |-
      REVERT (EIP-140) refunds the callee's unused gas to the caller and returns
      the revert data (accessible via RETURNDATASIZE and RETURNDATACOPY), so the
      caller learns why it failed and keeps the remaining gas. An exceptional halt
      consumes all gas that was forwarded to the callee frame and returns no data;
      the caller only sees the CALL push 0 for failure. In both cases the callee's
      state changes, logs, and value transfer are rolled back, but only REVERT
      preserves gas and returns a reason. A complete answer must say REVERT
      refunds remaining gas and returns data while an exceptional halt burns all
      forwarded gas.
  metadata:
    section: execution
    type: open
    difficulty: understanding
    source: https://eips.ethereum.org/EIPS/eip-140
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: execution

