- id: execution-jumpdest-analysis
  type: open
  question: |
    A contract's bytecode contains the instruction PUSH2 0x5b5b. Can a JUMP
    target either of those two 0x5b bytes? Explain the rule the EVM applies.
  answer: |
    No. Although 0x5b is the JUMPDEST opcode, bytes that are the immediate data
    of a PUSH instruction are not instructions, and the EVM performs JUMPDEST
    analysis that only marks 0x5b bytes at genuine instruction boundaries as
    valid jump destinations. A JUMP or JUMPI whose target is not a valid
    JUMPDEST (including one inside PUSH data) causes an exceptional halt that
    consumes all remaining gas. A complete answer must say the jump is invalid
    because bytes inside PUSH immediates are not valid JUMPDESTs, and that the
    result is an exceptional halt.
  difficulty: understanding
  source: https://ethereum.github.io/yellowpaper/paper.pdf

