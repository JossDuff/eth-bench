  question: "Ethereum's Fusaka hard fork (December 2025) shipped EIP-7594 (PeerDAS) alongside\
    \ a second headline EIP that raised blob capacity (\"more blobs\"). What is that second\
    \ EIP's number? \nEnd your reply with a line of the form \"Answer: <EIP number>\".\n"
