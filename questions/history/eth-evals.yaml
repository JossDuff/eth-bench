- id: roadmap-k-05
  type: open
  question: "In Ethereum's hard-fork planning process (the inclusion stages defined in EIP-7723),\
    \ one status means an EIP is effectively in the fork: devnets are testing it and, barring\
    \ disasters, it ships. What is the three-letter acronym for that status? \nEnd your reply\
    \ with a line of the form \"Answer: <acronym>\".\n"
  answer: |
    The response's answer must match the pattern `\bsfi\b|scheduled\s+for\s+inclusion` (that is, it must name the concept the pattern captures). The reference answer is: Answer: SFI. Reference from ethskills: "**SFI (Scheduled for Inclusion)**: It's in. Devnets are testing it. Barring disasters, it ships. Defined in EIP-7723"
  difficulty: recall
  source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-roadmap.jsonl
  tags:
  - eth-evals
  - roadmap
