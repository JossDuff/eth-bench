- description: history/roadmap-k-04
  vars:
    type: open
    question: "Ethereum's Fusaka hard fork (December 2025) shipped EIP-7594 (PeerDAS) alongside a second\
      \ headline EIP that raised blob capacity (\"more blobs\"). What is that second EIP's number? \n\
      End your reply with a line of the form \"Answer: <EIP number>\"."
    answer: |-
      The response's final answer must be the integer 7892 (decimal or the equivalent hex). Reference from ethskills: "| Fusaka | Dec 3, 2025 | PeerDAS (EIP-7594), more blobs (EIP-7892) |" Grade INCORRECT for these tempting wrong answers: `Answer: EIP-1559`; `Answer: 7893`
  metadata:
    section: history
    type: open
    difficulty: recall
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-roadmap.jsonl
    tags:
      - eth-evals
      - roadmap
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: history

- description: history/roadmap-k-05
  vars:
    type: open
    question: "In Ethereum's hard-fork planning process (the inclusion stages defined in EIP-7723), one\
      \ status means an EIP is effectively in the fork: devnets are testing it and, barring disasters,\
      \ it ships. What is the three-letter acronym for that status? \nEnd your reply with a line of the\
      \ form \"Answer: <acronym>\"."
    answer: |-
      The response's answer must match the pattern `\bsfi\b|scheduled\s+for\s+inclusion` (that is, it must name the concept the pattern captures). The reference answer is: Answer: SFI. Reference from ethskills: "**SFI (Scheduled for Inclusion)**: It's in. Devnets are testing it. Barring disasters, it ships. Defined in EIP-7723"
  metadata:
    section: history
    type: open
    difficulty: recall
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-roadmap.jsonl
    tags:
      - eth-evals
      - roadmap
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: history

- description: history/roadmap-k-06
  vars:
    type: open
    question: "In the standard EIP lifecycle (Draft, Review, ..., Final), which status marks the point\
      \ where the proposal gets serious: the spec is frozen and there is a final objections period before\
      \ it becomes Final? \nEnd your reply with a line of the form \"Answer: <status name>\"."
    answer: |-
      The response's answer must match the pattern `last[\s-]*call` (that is, it must name the concept the pattern captures). The reference answer is: Answer: Last Call. Reference from ethskills: "**Last Call**: Serious — spec is frozen, final objections period."
  metadata:
    section: history
    type: open
    difficulty: recall
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-roadmap.jsonl
    tags:
      - eth-evals
      - roadmap
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: history

- description: history/roadmap-k-08
  vars:
    type: multiple_choice
    question: Who decides which EIPs ship in an Ethereum hard fork?
    choices:
      - The Ethereum Foundation board approves the final list
      - Vitalik Buterin has final sign-off
      - |-
        Rough consensus in the All Core Devs (ACD) process among client teams, researchers, and the community
      - An on-chain vote by ETH holders
    answer: C
  metadata:
    section: history
    type: multiple_choice
    difficulty: understanding
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-roadmap.jsonl
    tags:
