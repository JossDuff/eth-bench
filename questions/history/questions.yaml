- id: history-upgrade-naming-conventions
  type: open
  question: |
    Ethereum's upgrades have names like Shapella, Dencun, Pectra, and Fusaka.
    Explain the naming conventions that produce these names.
  answer: |
    Since the Merge each upgrade has separate execution layer and consensus
    layer names. Execution layer upgrades are named after cities that hosted
    Devcon, in order (Berlin, London, Paris, Shanghai, Cancun, Prague, Osaka,
    Amsterdam). Consensus layer upgrades are named after stars in alphabetical
    order (Altair, Bellatrix, Capella, Deneb, Electra, Fulu, Gloas). The
    combined upgrade is a portmanteau: Shanghai + Capella = Shapella, Deneb +
    Cancun = Dencun, Prague + Electra = Pectra, Fulu + Osaka = Fusaka, Gloas +
    Amsterdam = Glamsterdam. A complete answer must say execution names are
    Devcon cities, consensus names are alphabetical stars, and the combined name
    merges the two.
  difficulty: recall
  source: https://eips.ethereum.org/EIPS/eip-7773

