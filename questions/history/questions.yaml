- id: history-halt-rollback
  type: open
  question: |
    Has Ethereum ever halted or had a rollback?
  answer: |
    No.  Ethereum has never halted and has never had a rollback.
    The DAO bug was a single invalid state transition, not a rollback.

    A "Yes" answer to either clause is incorrect.  A correct answer reports 
    that Ethereum has never halted and has never had a rollback.
  difficulty: recall

