- description: history/history-bellatrix-then-paris
  vars:
    type: open
    question: |-
      The Merge in September 2022 was delivered as two separate upgrades,
      Bellatrix and Paris, about nine days apart. What did each do and why were
      two steps needed?
    answer: |-
      Bellatrix was the consensus layer upgrade, activated on the beacon chain at
      epoch 144,896 on 6 September 2022. It prepared the beacon chain to accept
      execution payloads and made validators start watching the proof-of-work
      chain for the terminal block. Paris was the execution layer change,
      triggered when the proof-of-work chain reached the terminal total
      difficulty (58750000000000000000000) on 15 September 2022: from the next
      block, execution blocks were produced only as payloads inside beacon blocks
      and proof-of-work mining ended. Two steps were needed because the beacon
      chain had to be upgraded and stable ahead of time at a known epoch, whereas
      the exact moment the difficulty threshold would be reached depended on hash
      rate and could not be scheduled by epoch. A complete answer must say
      Bellatrix upgraded the consensus layer at a fixed epoch first and Paris
      switched execution over when the terminal total difficulty was hit.
  metadata:
    section: history
    type: open
    difficulty: understanding
    source: https://eips.ethereum.org/EIPS/eip-3675
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: history

