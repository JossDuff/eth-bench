- id: history-medalla-incident
  type: open
  question: |
    What happened on the Medalla beacon chain testnet in August 2020, and what
    lesson did it teach about client diversity?
  answer: |
    On 14 August 2020 the Prysm client, which the large majority of Medalla
    validators ran, received bad time data from the Cloudflare Roughtime
    servers it used for clock sync and jumped its clock about four hours into
    the future. Prysm nodes started producing blocks and attestations for
    future slots, other clients rejected them, and when the clocks were fixed
    those validators had already committed to conflicting messages, so many
    were slashed. With more than a third of validators effectively offline the
    testnet lost finality for days, the inactivity leak drained balances, and
    the network fragmented; client teams shipped sync and peering fixes over
    the following days. The lesson was that a single dominant client turns one
    bug into a network-wide failure, which fed the push for client diversity
    before mainnet genesis. A complete answer must describe a clock or time
    bug in the dominant Prysm client causing loss of finality, and connect it to
    the danger of one client having a supermajority.
  difficulty: recall
  source: https://blog.ethereum.org/2020/09/01/eth2-quick-update-no-15

- id: history-parity-multisig-freeze
  type: open
  question: |
    In November 2017 roughly 513,000 ETH became permanently inaccessible. What
    happened, and how did the community respond to the proposal to recover it?
  answer: |
    Parity's multisig wallet contracts were thin proxies delegating to a shared
    library contract. After a July 2017 hack, the library was redeployed but
    left uninitialised; on 6 November 2017 a user called initWallet on the
    library, became its owner, and then invoked kill, self-destructing the
    library. Every wallet depending on it lost its logic, freezing about
    513,774 ETH across 587 wallets, including Polkadot's fundraising funds.
    EIP-999 proposed restoring the library's code through a hard fork; the
    community rejected it, including in a CarbonVote poll, because it would
    have been an irregular state change to rescue one party's funds, unlike
    the network-threatening DAO situation, so the ETH remains frozen. A complete
    answer must describe the destruction of the shared Parity library contract
    freezing the wallets and say the recovery proposal (EIP-999) was rejected.
  difficulty: recall
  source: https://eips.ethereum.org/EIPS/eip-999

