- id: history-2016-dos-attack-forks
  type: open
  question: |
    In autumn 2016 Ethereum shipped two unplanned hard forks in quick
    succession. What prompted them and what did each one change?
  answer: |
    Starting during Devcon2 in September 2016, attackers exploited underpriced
    opcodes (such as EXTCODESIZE and SUICIDE/SELFDESTRUCT) to slow the network
    and bloat the state with millions of empty accounts. Tangerine Whistle
    (EIP-150, block 2,463,000, 18 October 2016) repriced IO-heavy opcodes and
    introduced the 63/64 rule for gas forwarded to calls. Spurious Dragon (block
    2,675,000, 22 November 2016) added EIP-155 replay protection (chain ID in
    signatures), EIP-161 state clearing so the empty accounts created by the
    attack could be removed, and EIP-170's 24,576-byte contract code size
    limit. A complete answer must connect the forks to the 2016 DoS attacks and
    give at least one change from each fork (opcode repricing for Tangerine
    Whistle; replay protection, state clearing, or the code size limit for
    Spurious Dragon).
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-607

- id: history-may-2023-finality-incidents
  type: open
  question: |
    What happened to Ethereum mainnet on 11 and 12 May 2023?
  answer: |
    Mainnet suffered two loss-of-finality incidents, about 25 minutes on 11 May
    and about an hour on 12 May, with attestation participation dropping as low
    as roughly 30-40%. The cause was in some consensus clients (notably Prysm
    and Teku): when they received valid but old attestations whose target was
    a previous epoch, they replayed beacon states to verify them, which was
    very expensive with the large post-Capella validator set, and the resulting
    CPU exhaustion stopped validators performing duties. The chain kept
    producing blocks, the inactivity leak activated on mainnet for the first
    time, and client patches fixed the issue. A complete answer must say
    finality was lost temporarily and attribute it to client resource
    exhaustion from processing old attestations (or a client bug), not a
    protocol fault or an attack.
  difficulty: recall
  source: https://ethresear.ch/t/cascading-network-effects-on-ethereums-finality/15871

- id: history-november-2020-geth-split
  type: open
  question: |
    On 11 November 2020 part of the Ethereum network followed a different chain
    for a time, taking Infura and several exchanges offline. What caused it?
  answer: |
    A consensus bug in Geth (a shallow-copy bug affecting versions 1.9.7 to
    1.9.16) had been reported privately in July 2020 and fixed quietly in Geth
    1.9.17 without public disclosure. On 11 November a transaction triggered the
    bug at block 11,234,873, so nodes still running old Geth versions, including
    Infura's infrastructure and some exchanges, diverged onto a minority chain
    while upgraded nodes and other clients continued on the canonical chain. The
    episode caused a widely felt Infura outage and prompted debate about
    silently fixing consensus bugs versus disclosing them. A complete answer must
    say an unpatched Geth consensus bug caused nodes on old versions to split
    from the main chain.
  difficulty: recall
  source: https://blog.ethereum.org/2020/11/12/geth-security-release

