- id: history-istanbul-eip-1884-repricing
  type: open
  question: |
    Istanbul (December 2019) included EIP-1884, which raised the gas cost of
    several opcodes. What was repriced, why, and what did the change break?
  answer: |
    EIP-1884 raised SLOAD from 200 to 800 gas, BALANCE from 400 to 700, and
    EXTCODEHASH from 400 to 700, and added SELFBALANCE (5 gas) so contracts
    could read their own balance cheaply. The rationale was that state had
    grown so much that these trie-reading operations took far longer than
    their gas price reflected, making them a denial-of-service vector. The
    repricing broke contracts whose fallback functions relied on fitting inside
    the 2,300 gas stipend of a plain ETH transfer, for example Aragon and
    Kyber contracts that did an SLOAD in their fallback, so sending ETH to them
    started failing. A complete answer must mention SLOAD (or BALANCE or
    EXTCODEHASH) becoming more expensive because of state growth, and that
    contracts relying on the 2,300 gas stipend broke.
  difficulty: understanding
  source: https://eips.ethereum.org/EIPS/eip-1884

