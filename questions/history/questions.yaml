    question: |-
      As of mid-2026, what is the next planned Ethereum network upgrade after
      Fusaka, and what are its headline changes?
    answer: |-
      Glamsterdam (meta EIP-7773). Its headline changes are enshrined
      proposer-builder separation (EIP-7732) on the consensus layer and block-level
      access lists (EIP-7928) on the execution layer, with a further set of smaller
      EIPs scheduled alongside them. A complete answer must name Glamsterdam and at
      least one of ePBS (EIP-7732) or block-level access lists (EIP-7928).
