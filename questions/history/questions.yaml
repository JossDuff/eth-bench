- description: history/history-holesky-pectra-failure
  vars:
    type: open
    question: |-
      What went wrong when the Pectra upgrade was activated on the Holesky testnet
      in February 2025?
    answer: |-
      Several execution clients (Geth, Nethermind, and Besu) had the wrong deposit
      contract address configured for Holesky, so they accepted a block that clients
      with the correct address (Reth, Erigon) rejected. The network split and could
      not finalize, and the resulting inactivity leak drained validator balances and
      produced a huge exit queue. Recovery required coordinated manual intervention,
      and Holesky never fully returned to a healthy state for validator testing. A
      complete answer must mention a client misconfiguration of the deposit
      contract address leading to a chain split and loss of finality.
  metadata:
    section: history
    type: open
    difficulty: understanding
    source: |-
      https://github.com/ethereum/pm/blob/master/Network-Upgrade-Archive/Pectra/holesky-postmortem.md
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: history

- description: history/history-holesky-shutdown-hoodi
  vars:
    type: open
    question: Why was the Holesky testnet shut down, and what replaced it?
    answer: |-
      After the failed Pectra activation, Holesky suffered a long inactivity leak
      and an enormous exit queue, which made it useless for testing validator
      lifecycles. The Hoodi testnet was launched in March 2025 as the replacement
      for staking and validator testing, while Sepolia remained the testnet for
      application developers. Holesky was kept alive long enough to test Fusaka
      and was shut down in September 2025. A complete answer must connect the
      shutdown to the Pectra incident's aftermath (inactivity leak or exit queue)
      and name Hoodi as the replacement.
  metadata:
    section: history
    type: open
    difficulty: recall
    source: https://blog.ethereum.org/en/2025/09/01/holesky-shutdown-announcement
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: history

