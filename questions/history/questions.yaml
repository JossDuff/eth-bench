- description: history/history-istanbul-calldata-cost-reduction
  vars:
    type: open
    question: |-
      An ordinary, non-contract-creation transaction has calldata containing
      exactly 100 zero bytes and 100 nonzero bytes. By how much did Istanbul's
      EIP-2028 reduce the intrinsic gas charge for this calldata, compared with
      the rules immediately before Istanbul? Exclude the base transaction cost.
    answer: |-
      EIP-2028 reduced the charge for each nonzero calldata byte from 68 to
      16 gas while leaving the zero-byte charge at 4 gas. The calldata charge
      fell from 7,200 gas to 2,000 gas, a reduction of 5,200 gas. A complete
      answer must give the reduction as 5,200 gas; the intermediate totals
      are not required.
  metadata:
    section: history
    type: open
    difficulty: reasoning
    source: https://eips.ethereum.org/EIPS/eip-2028
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: history

