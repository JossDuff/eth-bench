- id: history-dao-fork
  type: open
  question: |
    What did the 2016 DAO fork do, and why was it controversial?
  answer: |
    After an attacker drained roughly 3.6 million ETH from The DAO contract, the
    community adopted a hard fork that made an irregular state change moving the
    DAO's funds to a recovery contract so original holders could withdraw. It was
    controversial because it overrode the results of contract execution, which
    critics saw as violating immutability and "code is law". Those who rejected
    the fork continued the original chain as Ethereum Classic. A complete answer
    must mention the irregular state change returning DAO funds and the
    immutability objection or the Ethereum Classic split.
  difficulty: understanding
  source: https://blog.ethereum.org/2016/07/20/hard-fork-completed

- id: history-constantinople-postponement
  type: open
  question: |
    Constantinople was scheduled for mainnet in mid-January 2019 but was
    postponed at the last minute. Why, and how was the issue resolved?
  answer: |
    A security audit (by ChainSecurity) found that EIP-1283, net gas metering
    for SSTORE, made some storage writes cheap enough to fit within the 2,300
    gas stipend that accompanies a plain value transfer, which reintroduced a
    reentrancy risk for contracts that assumed a recipient could not change
    state during a transfer. Core developers postponed the fork about a day
    before activation. It was resolved by activating Constantinople together
    with a second fork, Petersburg (St. Petersburg), at the same block
    (7,280,000, on 28 February 2019); Petersburg's only purpose was to remove
    EIP-1283. A complete answer must attribute the delay to EIP-1283 enabling
    reentrancy via cheaper SSTORE and mention that EIP-1283 was removed (via
    Petersburg) before Constantinople shipped.
  difficulty: understanding
  source: https://blog.ethereum.org/2019/01/15/security-alert-ethereum-constantinople-postponement

