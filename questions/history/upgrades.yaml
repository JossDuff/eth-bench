- id: history-dao-fork
  type: open
  question: |
    What did the 2016 DAO fork do, and why was it controversial?
  answer: |
    After an attacker drained roughly 3.6 million ETH from The DAO contract, the
    community adopted a hard fork that made an irregular state change moving the
    DAO's funds to a recovery contract so original holders could withdraw. It was
    controversial because it overrode the results of contract execution, which
    critics saw as violating immutability and "code is law". Those who rejected
    the fork continued the original chain as Ethereum Classic. A complete answer
    must mention the irregular state change returning DAO funds and the
    immutability objection or the Ethereum Classic split.
  difficulty: understanding
  source: https://blog.ethereum.org/2016/07/20/hard-fork-completed
