    answer: |-
      The response's answer must match the pattern `maximal(ly)?[\s-]*extractable[\s-]*value` (that is, it must name the concept the pattern captures). The reference answer is: Answer: Maximal Extractable Value. Reference from ethskills: "**MEV (Maximal Extractable Value):** Validators and searchers can reorder, insert, or censor transactions within a block."
