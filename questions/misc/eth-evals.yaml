      value: '{{answer}}'
      metric: misc

- description: misc/fundamentals-k-03
  vars:
    type: multiple_choice
    question: |-
      An autonomous AI agent runs a paid service as a smart contract on Ethereum. The startup that originally deployed the contract later shuts down. According to the standard argument for building agent services on a permissionless blockchain like Ethereum, what happens to the service?
    choices:
      - |-
        It keeps running indefinitely, because it never depended on any company's cooperation
      - It halts until governance appoints a new operator
      - It switches to read-only mode
      - Validators automatically pause it after a period of inactivity
    answer: A
  metadata:
    section: misc
    type: multiple_choice
    difficulty: understanding
    source: |-
      https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-fundamentals.jsonl
