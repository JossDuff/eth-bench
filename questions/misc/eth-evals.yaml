- description: misc/mev-k-01
  vars:
    type: open
    question: |-
      A limited NFT collection opens minting. You submit your mint transaction through a public RPC. A bot spots it while it is pending, copies the call, and submits its own mint with a higher priority fee so that its transaction executes before yours and takes the scarce item. In MEV terminology, what is the general name for placing your transaction ahead of a victim's pending transaction like this?
      End your reply with a line of the form "Answer: <short answer>".
    answer: |-
      The response's answer must match the pattern `front[\s-]*run` (that is, it must name the concept the pattern captures). The reference answer is: Answer: frontrunning. Reference from ethskills: "They profit by frontrunning your transaction, backrunning it, or both. … - NFT mints with high demand (bots frontrun to mint first)"
  metadata:
    section: misc
    type: open
    difficulty: recall
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-mev.jsonl
    tags:
      - eth-evals
      - mev
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: misc

