- description: misc/mev-k-08
  vars:
    type: open
    question: |-
      Post-Merge Ethereum runs an out-of-protocol block auction via MEV-Boost: specialized, profit-maximizing parties gather transactions and searcher bundles, assemble complete candidate blocks, and bid for the right to have a validator propose their block; the validator merely signs the most profitable header. What is this specialized block-assembling role called?
      End your reply with a line of the form "Answer: <short answer>".
    answer: |-
      The response's answer must match the pattern `\bbuilders?\b` (that is, it must name the concept the pattern captures). The reference answer is: Answer: the (block) builder. Reference from ethskills: "canon — Flashbots MEV-Boost docs (proposer-builder separation): mev-boost is open-source middleware run by validators to access a competitive block-building market; block builders produce full blocks from transaction orderflow and bid a fee for the block proposer to propose them."
  metadata:
    section: misc
    type: open
    difficulty: recall
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-mev.jsonl
    tags:
      - eth-evals
      - mev
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: misc

- description: misc/mev-k-09
  vars:
    type: open
    question: |-
      In the MEV-Boost architecture, a trusted intermediary receives complete blocks from the parties that assemble them, verifies the blocks and their bids, forwards only the highest-paying block header for the validator to sign, and releases the full block body only after the validator has signed — so the validator can never see the transactions and steal the strategies inside. What is this intermediary called?
      End your reply with a line of the form "Answer: <short answer>".
    answer: |-
      The response's answer must match the pattern `\brelays?\b` (that is, it must name the concept the pattern captures). The reference answer is: Answer: the relay. Reference from ethskills: "canon — Flashbots MEV-Boost docs: relays are trusted mediators between block builders and validators; they validate blocks and bids and withhold the block body until the proposer has blindly signed the header, preventing the proposer from stealing the block's MEV."
  metadata:
    section: misc
    type: open
    difficulty: recall
    source: https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-mev.jsonl
    tags:
      - eth-evals
      - mev
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: misc

- description: misc/mev-k-10
  vars:
    type: multiple_choice
    question: |-
      Flashbots MEV-Share is an orderflow auction: users (or their wallets) submit transactions privately with selectively disclosed hints, and searchers bid for the right to backrun them. By default, where does the bulk of the value paid by the winning searcher end up?
    choices:
      - Split evenly among all MEV-Boost relays
      - Burned, like EIP-1559 base fees
      - Kept by Flashbots as a protocol fee
      - Refunded to the user whose transaction created the MEV opportunity
    answer: D
  metadata:
