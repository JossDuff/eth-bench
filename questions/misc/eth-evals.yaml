    type: open
    question: |-
      What is Ethereum mainnet's target block time, in seconds?
      End your reply with a line of the form "Answer: <number>".
    answer: |-
      The response's final answer must be the integer 12 (decimal or the equivalent hex). Reference from ethskills: "**Block time:** 12 seconds"
  metadata:
