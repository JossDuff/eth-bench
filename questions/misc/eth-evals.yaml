    question: |-
      You sign a large DEX swap in your wallet and broadcast it through a standard public RPC endpoint. Seconds later — while the transaction is still pending, before it is included in any block — MEV bots across the network already know the exact token pair, trade size, and slippage setting. Which shared, publicly observable data structure did the bots read your pending transaction from?
      End your reply with a line of the form "Answer: <short answer>".
    answer: |-
      The response's answer must match the pattern `mem[\s-]?pool|tx[\s-]?pool|transaction[\s-]?pool` (that is, it must name the concept the pattern captures). The reference answer is: Answer: the public mempool. Reference from ethskills: "2. Attacker sees your tx in the mempool"
