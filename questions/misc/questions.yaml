- description: misc/roadmap-state-vs-history-expiry
  vars:
    type: open
    question: |-
      What is the difference between history expiry and state expiry, and why
      has one shipped while the other has not?
    answer: |-
      History expiry (EIP-4444) lets nodes discard old block bodies, receipts,
      and eventually headers past a retention window; it affects only data needed
      to re-derive the past, not to validate new blocks, so the protocol's state
      transition is untouched and nodes can drop it unilaterally with the data
      still retrievable from archives or peers (partial history expiry shipped in
      2025). State expiry would remove or make inaccessible parts of the current
      state (accounts and storage untouched for a long time) so that state stops
      growing; that changes what a block can access, requires a way for users to
      revive expired state with proofs, and interacts with address space and
      tree design, making it a deep consensus change that is still research.
      A complete answer must distinguish discarding historical chain data
      (shipped) from expiring live state needed for execution (not shipped) and
      give the reason that state expiry changes execution semantics or requires
      resurrection proofs.
  metadata:
    section: misc
    type: open
    difficulty: understanding
    source: https://eips.ethereum.org/EIPS/eip-4444
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: misc

- description: misc/roadmap-verkle-to-binary-pivot
  vars:
    type: multiple_choice
    question: |-
      Verkle trees were the planned replacement for Ethereum's Merkle Patricia
      trie for years. Why did core developers pivot toward a binary hash tree
      (EIP-7864) instead?
    choices:
      - Verkle trees could not represent contract storage, only account balances
      - Binary trees allow validators to skip storing state entirely
      - |-
        Verkle commitments rely on elliptic curve cryptography that is not post-quantum secure and is awkward inside SNARKs, whereas a hash-based binary tree is quantum-resistant and prover-friendly
      - Verkle proofs turned out to be larger than Merkle Patricia proofs
    answer: C
  metadata:
    section: misc
    type: multiple_choice
    difficulty: understanding
    source: https://eips.ethereum.org/EIPS/eip-7864
