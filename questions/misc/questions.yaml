- description: misc/roadmap-lean-ethereum-pillars
  vars:
    type: open
    question: What is "lean Ethereum" and what are its main pillars?
    answer: |-
      Lean Ethereum is the Ethereum Foundation's long-term vision for a simpler,
      hardened, post-quantum protocol built on hash-based cryptography. Its three
      pillars are lean consensus (a beacon chain 2.0 hardened for security and
      decentralisation with finality in seconds), lean data (blobs 2.0 with
      post-quantum commitments and finer-grained blob sizing), and lean execution
      (a minimal, SNARK-friendly instruction set, possibly RISC-V based). A
      complete answer must name the three pillars of consensus, data, and execution
      and mention post-quantum or hash-based cryptography as a theme.
  metadata:
    section: misc
    type: open
    difficulty: recall
    source: https://blog.ethereum.org/en/2025/07/31/lean-ethereum
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: misc

- description: misc/roadmap-extremely-lean-chain-privacy
  vars:
    type: open
    question: |-
      What does "The Extremely Lean Chain" proposal suggest, and how does it give
      validators privacy?
    answer: |-
      It proposes shrinking consensus state to almost nothing by having validators,
      not the protocol, track their own balances: validators periodically submit
      zero-knowledge proofs of their participation and rewards instead of the chain
      computing them. Validator privacy comes from re-anonymisation: each validator
      registers with a fresh public key each period and proves in zero knowledge
      that it is a legitimate validator with a certain balance, without revealing
      which past identity it corresponds to, so the chain never tracks a persistent
      validator identity and proposer selection becomes approximately a secret
      leader election. A complete answer must mention validators proving their own
      state with ZK proofs and periodic fresh keys that break the link between a
      validator's identities over time.
  metadata:
    section: misc
    type: open
    difficulty: reasoning
    source: https://ethresear.ch/t/the-extremely-lean-chain/25369
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: misc

- description: misc/roadmap-new-commitment-scheme-tradeoffs
  vars:
    type: open
    question: |-
      What are the tradeoffs of adding a new commitment scheme or erasure coding
      algorithm to Ethereum?
    answer: |-
      Benefits can include faster propagation, post-quantum security, or cheaper
      proving. The costs are significant: every client team must implement and
      audit new cryptography, which is complex and error-prone; a second scheme
      alongside KZG means two code paths and two sets of security assumptions
      (including any trusted setup); rollups and tooling built on the existing
      commitments must adapt; and the protocol surface grows permanently. Vitalik
      Buterin has argued that introducing a whole new commitment scheme is "a lot of
      needless complexity" unless the gain is large. A complete answer must weigh a
      concrete benefit against implementation complexity, security review burden,
      and the cost of maintaining multiple schemes.
  metadata:
    section: misc
    type: open
    difficulty: reasoning
    source: https://ethresear.ch/t/faster-block-blob-propagation-in-ethereum/21370/27
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: misc

