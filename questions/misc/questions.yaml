- description: misc/l2-op-deposit-alias-modular-wrap
  vars:
    type: open
    question: |-
      Under the OP Stack deposit specification's L1-to-L2 address-aliasing
      rule, consider a deposit whose sender is subject to aliasing. If its
      L1 sender address is 0xffffffffffffffffffffffffffffffffffffffff,
      what is the aliased L2 sender address? Show how the rule handles overflow.
    answer: |-
      The aliasing offset is 0x1111000000000000000000000000000000001111.
      The rule adds this offset to the L1 address modulo 2^160.
      Since the supplied address is 2^160 - 1, the result is the offset
      minus one: 0x1111000000000000000000000000000000001110.
      A complete answer must give that address and explain that addition wraps
      modulo 2^160 rather than reverting or retaining a 161st bit.
  metadata:
    section: misc
    type: open
    difficulty: reasoning
    source: https://specs.optimism.io/protocol/deposits.html#address-aliasing
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: misc
