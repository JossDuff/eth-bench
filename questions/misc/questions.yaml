- description: misc/rpc-blockhash-canonicality-error-distinction
  vars:
    type: open
    question: |-
      Under EIP-1898, an eth_getBalance request identifies its block using
      {"blockHash": H, "requireCanonical": true}. Compare the recommended
      JSON-RPC errors when H is unknown and when H is known but noncanonical.
      If both existence and canonicality checks would fail, which takes precedence?
    answer: |-
      An unknown block should produce a block-not-found error, with recommended
      code -32001 (Resource not found). A known but noncanonical block should
      produce a distinct error, with recommended code -32000 (Invalid input).
      The block-not-found check takes precedence over the canonicality check.
      A complete answer must distinguish the two cases, give the recommended
      codes, and state that block-not-found takes precedence. These codes are
      recommendations, not mandatory choices of error code.
  metadata:
    section: misc
    type: open
    difficulty: reasoning
    source: https://eips.ethereum.org/EIPS/eip-1898
  assert:
    - type: llm-rubric
