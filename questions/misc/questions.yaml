- description: misc/engine-forkchoice-invalid-attributes-side-effect
  vars:
    type: open
    question: |-
      Under the Paris Engine API specification, engine_forkchoiceUpdatedV1
      receives a valid forkchoiceState that the execution client can apply,
      but its non-null payloadAttributes are invalid because their timestamp
      is not greater than the head block's timestamp. Does rejecting those
      payload attributes also prevent the forkchoice update from taking effect?
    answer: |-
      No. The execution client must apply the valid forkchoice-state update
      even though the payload attributes are invalid. Invalid payload attributes
      prevent the requested payload build and produce an Invalid payload
      attributes error; they do not roll back the forkchoice update.
      A complete answer must state that the forkchoice update still takes effect.
      The numeric error code is not required.
  metadata:
    section: misc
    type: open
    difficulty: understanding
    source: https://github.com/ethereum/execution-apis/blob/main/src/engine/paris.md
