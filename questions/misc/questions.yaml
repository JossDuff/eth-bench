- description: misc/epbs-payload-timeliness-committee
  vars:
    type: open
    question: |-
      In enshrined proposer-builder separation (EIP-7732), what is the Payload
      Timeliness Committee and why does the design need it?
    answer: |-
      EIP-7732 splits the slot in two: the proposer publishes a beacon block that
      contains a signed builder bid (a commitment to an execution payload and a
      payment) and the builder reveals the actual payload later in the slot. The
      Payload Timeliness Committee (PTC) is a committee of PTC_SIZE = 512
      validators per slot who attest to whether the builder revealed the payload
      on time (and whether blob data was available). Their votes let the fork
      choice treat a block whose payload was withheld as "empty" while still
      counting the beacon block, so the builder is paid unconditionally once the
      proposer's block is included and the proposer cannot be griefed by a
      withheld payload; it removes the need for a trusted relay to enforce the
      exchange. A complete answer must say the PTC attests to timely payload
      reveal and that this is what lets the protocol enforce the proposer-builder
      exchange without relays.
  metadata:
    section: misc
    type: open
    difficulty: understanding
    source: https://eips.ethereum.org/EIPS/eip-7732
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: misc

- description: misc/bal-block-level-access-lists
  vars:
    type: open
    question: |-
      What does a Block-Level Access List (EIP-7928, scheduled for Glamsterdam)
      contain, and how does it differ from EIP-2930 transaction access lists?
    answer: |-
      A BAL records every address and storage key touched during block execution,
      grouped per account, along with the post-transaction values of storage
      writes, balance changes, nonce changes, and code changes, indexed by the
      transaction that made them. The block header commits to it via a
      block_access_list_hash, and a block whose BAL does not match its execution
      is invalid. Unlike EIP-2930 lists, which are optional hints supplied by the
      transaction sender and never checked, BALs are produced by the block builder,
      cover the whole block, and are enforced. They let clients prefetch state and
      execute transactions in parallel, compute the post-state root in parallel,
      and update state without re-executing. A complete answer must say BALs are
      enforced block-wide lists including post-state values and that they enable
      parallel execution or state prefetching, in contrast to unenforced 2930
      lists.
  metadata:
    section: misc
    type: open
    difficulty: understanding
    source: https://eips.ethereum.org/EIPS/eip-7928
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: misc

- description: misc/history-expiry-partial-2025
  vars:
    type: open
    question: |-
      What is "partial history expiry", which execution clients rolled out in 2025,
      and what security model does it rely on?
    answer: |-
      Partial history expiry is the first step of EIP-4444: execution clients
      stop storing (or never download) block bodies and receipts from before the
      Merge, saving roughly 300 to 500 GB per node, while keeping all headers so
      the chain can still be verified cryptographically from genesis. Since
      proof-of-stake sync already starts from a weak-subjectivity checkpoint
      rather than executing from genesis, dropping old bodies does not change the
      default trust model. Availability relies on a 1-of-N assumption: as long as
      someone serves the history (institutional archives, torrents, peers that
      keep it, the Portal network), nodes can retrieve it out of protocol. A
      complete answer must say pre-Merge block bodies and receipts are dropped
      (headers kept) per EIP-4444 and mention the reliance on at least one
      provider still serving history.
  metadata:
    section: misc
    type: open
    difficulty: recall
    source: https://blog.ethereum.org/2025/07/08/partial-history-exp
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: misc

- description: misc/mev-timing-games
  vars:
    type: open
    question: |-
      What are "timing games" in Ethereum block production, and why are they a
      concern for the protocol?
    answer: |-
      A proposer using MEV-Boost can delay requesting and publishing its block
      until late in the slot, because builder bids keep rising as more
      transactions and MEV opportunities arrive; publishing later captures more
      value. This is a timing game. It is a concern because attesters must vote by
      the 4-second mark, so late blocks risk missing attestations and being
      reorged, degrading network health, and because the extra revenue accrues
      disproportionately to sophisticated or well-connected operators, pressuring
      honest validators to play the same game and pushing toward centralisation.
      Relays' timing restrictions and protocol changes such as ePBS or shorter
      slots are responses. A complete answer must describe deliberately delaying
      block publication to capture higher bids and mention the harm to attestation
      or network health or the centralising pressure.
  metadata:
    section: misc
    type: open
    difficulty: reasoning
    source: https://ethresear.ch/t/timing-games-implications-and-possible-mitigations/17612
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: misc

