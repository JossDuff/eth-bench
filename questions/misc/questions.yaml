- description: misc/engine-newpayload-blob-hash-order
  vars:
    type: open
    question: |-
      Under the Cancun Engine API specification, the blob versioned hashes
      extracted from an otherwise valid payload's transactions, in transaction
      order and then in each transaction's hash order, are [h1, h2], with
      h1 != h2. engine_newPayloadV3 is called with expectedBlobVersionedHashes
      equal to [h2, h1]. What payload status must it return, and why?
    answer: |-
      It must return INVALID. The expectedBlobVersionedHashes parameter must
      match the ordered list extracted from the payload exactly; equality as
      a set is insufficient. A complete answer must identify INVALID and
      explain that reversing the distinct hashes violates the ordering check.
      No latestValidHash or validationError detail is required.
