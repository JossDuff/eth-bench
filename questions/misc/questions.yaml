- id: sync-snap-sync
  type: open
  question: |
    How does snap sync let an execution client reach the head of the chain
    without executing every historical block?
  answer: |
    Snap sync downloads block headers to the head, verifies the chain of
    headers, then fetches the current state directly: peers serve contiguous
    ranges of accounts and storage slots from a flat snapshot along with Merkle
    proofs for the range boundaries, so the syncing node can verify each chunk
    against a recent state root without replaying transactions. Because the
    head moves while downloading, the state arrives from slightly different
    roots, so a final "healing" phase walks the trie and requests the missing
    or stale nodes to converge on a single consistent root, after which the
    node executes only the latest blocks. A complete answer must say the state
    is downloaded in verified ranges against a recent root rather than
    reconstructed by executing history, and mention the healing step or the
    verification by Merkle proofs.
  difficulty: understanding
  source: https://github.com/ethereum/devp2p/blob/master/caps/snap.md

- id: mev-boost-message-flow
  type: open
  question: |
    Walk through the messages a validator exchanges with a relay when
    proposing a block through MEV-Boost, and explain what the proposer signs.
  answer: |
    Ahead of time the validator registers with relays (registerValidator),
    signing its fee recipient and gas limit preferences. When its slot arrives
    it requests the best bid (getHeader) and receives a signed builder bid
    containing only the execution payload header and the bid value, not the
    transactions. The proposer signs a blinded beacon block that commits to
    that header and returns it to the relay (getPayload / submitBlindedBlock).
    Only then does the relay reveal the full execution payload, which the
    proposer publishes as a complete signed beacon block. Because the proposer
    has signed the header before seeing the contents, it cannot steal the
    builder's transactions, and because the relay withholds the payload until
    it has a signature, the builder is protected; the relay is the trusted
    party in the middle. A complete answer must mention that the proposer
    receives a header (blinded block) and signs it before the relay releases
    the full payload.
  difficulty: understanding
  source: https://github.com/ethereum/builder-specs

- id: l2-based-rollups
  type: open
  question: |
    What is a "based" rollup, and what does it gain and give up compared with a
    rollup that runs its own sequencer?
  answer: |
    A based rollup (based sequencing) has no separate sequencer: its blocks are
    ordered by whichever Ethereum L1 proposer is producing the current L1
    block, with anyone able to submit batches and the L1 proposer (or builders
    it uses) choosing the ordering. It inherits L1's liveness and censorship
    resistance directly, needs no sequencer governance or failover, avoids
    sequencer MEV capture by the rollup team (MEV flows to L1), and gets
    simpler synchronous composability with L1. It gives up fast pre-confirmations
    (block times are tied to L1's 12-second slots unless preconfirmation
    protocols are layered on), and it forgoes sequencing revenue as a business
    model. A complete answer must say the L1 proposer sequences the rollup and
    give one gain (L1 liveness or censorship resistance or decentralisation)
    and one cost (slower confirmations or lost sequencer revenue).
  difficulty: understanding
  source: https://ethresear.ch/t/based-rollups-superpowers-from-l1-sequencing/15016

