- description: security/security-01-reentrancy
  vars:
    type: open
    question: |-
      A Solidity withdraw function reads the caller's balance, sends that amount of ETH to the caller via a low-level call, and only after the call returns does it set the caller's balance to zero. An attacker's contract uses its receive function to call withdraw again before the first invocation finishes, draining the contract. What is the name of this vulnerability class?
      End your reply with a line of the form "Answer: <short answer>".
    answer: |-
      The response's answer must match the pattern `re-?(entranc|entry)` (that is, it must name the concept the pattern captures). The reference answer is: Answer: reentrancy.
