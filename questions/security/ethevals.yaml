- description: security/security-25-safe-delegatecall
  vars:
    type: multiple_choice
    question: |-
      A Safe multisig transaction is waiting for your signature. The other owners have signed. Fields: to = 0x40A2aCCbd92BCA938b02010E17A5b8929b49130D (a MultiSend contract), value = 0, operation = 1, data = multiSend(...) whose decoded contents are a routine ERC-20 transfer to a known address. What does operation = 1 mean, and why is it the first field to check?
    choices:
      - |-
        1 means "batch": it only tells the Safe that several calls are packed in the data
      - 1 means CALL with value; it only matters when ETH is attached
      - |-
        1 means DELEGATECALL: the target's code runs with the Safe's own storage and address, so a malicious target can rewrite the Safe's storage — including the singleton (mastercopy) slot — and take the Safe over, regardless of what the decoded inner calls look like; this is how the Bybit Safe was drained
      - operation is informational; the Safe ignores it when executing
    answer: C
