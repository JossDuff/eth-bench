      metric: security

- description: security/security-16-lending-postmortem-2
  vars:
    type: open
    question: |-
      We run the same fixed-rate borrowing contract on Ethereum mainnet and on
      Arbitrum One. Identical bytecode, identical constructor arguments, deployed a
      day apart. The rate is 4.00% per year. Interest is applied by a public
      accrueInterest() that anyone can call, and the accounting is:

        uint256 constant SECONDS_PER_BLOCK = 12;

        function accrueInterest() public {
            uint256 blocksElapsed = block.number - lastAccrualBlock;
            if (blocksElapsed == 0) return;
            uint256 secondsElapsed = blocksElapsed * SECONDS_PER_BLOCK;
            index += index * rateBps * secondsElapsed / (10_000 * 365 days);
            lastAccrualBlock = block.number;
        }

      Finance reconciled July across both deployments. On the rate alone, a
      borrower holding 1,000,000 USDC of debt for all 31 days should owe 3,397 USDC
      of interest. On mainnet that borrower was charged 3,391. On Arbitrum, same
      debt, same 31 days, the charge came out at 3,391 as well — the two
      deployments agree with each other to within a couple of dollars.

      I had braced for the Arbitrum figure to be nonsense. That chain produces
      blocks roughly every 250 milliseconds, so by my arithmetic this contract
      should have been charging tens of times too much interest there, and it
      plainly is not.

      Two things I need before we sign off on deploying this same contract to Base
      next month:

        1. Explain the July reconciliation. Why did Arbitrum land on the same
           number as mainnet, and why are both of them a shade under the 3,397 the
           rate implies?
        2. Tell me what this code will do on Base, with the arithmetic worked
           through on the same 1,000,000 USDC over 31 days.

      Then tell me what you would change, if anything.
    answer: |-
      Grade CORRECT only if the response satisfies every one of these points; a response that misses any of them is INCORRECT:
      - The response explains the Arbitrum result correctly: block.number inside a contract on Arbitrum One does not count L2 blocks, it reports (an approximation of) the current Ethereum L1 block number, so a 12-seconds-per-block assumption happens to line up with wall-clock time there. An answer that has Arbitrum's block.number counting 250ms L2 blocks, or that explains the match by anything other than block.number tracking L1, fails this check.
      - The response works out Base concretely and gets the direction and the order of magnitude right: on Base, block.number is the L2 block number, so with the chain's block time (state whichever figure the answer uses — roughly 1-2 seconds) each block is charged as 12 seconds and interest is massively OVER-accrued — around 6x at a 2-second block time, around 12x at 1 second — turning ~3,400 USDC of monthly interest into tens of thousands. The stated block time, the multiplier and the resulting figure must be arithmetically consistent with each other; the exact block time chosen is not what is graded.
      - The prescribed fix is to stop using block.number as a clock and accrue on block.timestamp instead. It must be stated explicitly.
      - The response does NOT offer a per-chain SECONDS_PER_BLOCK constant (or a per-chain deployment config of the same shape) as the remedy, and does not conclude that the mainnet deployment is the broken one. Mentioning a per-chain constant only to reject it is fine.
  metadata:
    section: security
    type: open
    difficulty: reasoning
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/security/security-16-lending-postmortem-2.yaml
    tags:
      - ethevals
      - security
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: security

- description: security/security-17-lending-postmortem-3
  vars:
    type: open
    question: |-
      Support ticket I cannot close, and I need to know what to tell the user.

      Our lending market lets a relayer submit a borrow that the borrower
      authorised off-chain, so borrowers never need gas:

        bytes32 constant BORROW_TYPEHASH = keccak256("Borrow(address borrower,uint256 amount)");

        constructor(...) {
            DOMAIN_SEPARATOR = keccak256(abi.encode(
                keccak256("EIP712Domain(string name,string version,uint256 chainId,address verifyingContract)"),
                keccak256("ArbiLend"),
                keccak256("1"),
                block.chainid,
                address(this)
            ));
        }

        function borrowWithSig(address borrower, uint256 amount, uint8 v, bytes32 r, bytes32 s) external {
            bytes32 structHash = keccak256(abi.encode(BORROW_TYPEHASH, borrower, amount));
            bytes32 digest = keccak256(abi.encodePacked("\x19\x01", DOMAIN_SEPARATOR, structHash));
            require(ecrecover(digest, v, r, s) == borrower, "bad sig");
            _borrow(borrower, amount);
        }

      The user signed one borrow, 5,000 USDC, in March. They repaid it in full in
      April and have signed nothing since. In June they woke up to a fresh 5,000
      USDC debt against their collateral, opened while they were on a flight they
      can produce a boarding pass for. The (v, r, s) in the June transaction's
      calldata is byte-identical to the one from March. Our relayer operator says
      they did not send it, and the June transaction came from an address none of
      us recognise.

      The user's position is that they only ever authorised one borrow, and the
      verification looks right to me — the recovered address is genuinely theirs,
      and no key was compromised on either side.

      Explain how the June borrow was possible, what else this same construction
      exposes us to that has not bitten us yet, and exactly what we ship to fix it.
    answer: |-
      Grade CORRECT only if the response satisfies every one of these points; a response that misses any of them is INCORRECT:
      - The response identifies the mechanism as signature replay: the signed struct carries no nonce and no expiry, and the contract records nothing about signatures it has already honoured, so the March authorisation stays valid forever and anyone who read it out of the March transaction's calldata can resubmit it. It attributes the June borrow to that, not to a compromised key, a malicious relayer, or a flaw in ecrecover.
      - The prescribed fix includes BOTH a per-signer nonce that is part of the signed struct and is incremented (or a mapping of consumed digests) AND a deadline / expiry carried in the signed struct and checked on-chain. Adding the typehash fields is part of the fix — a nonce checked on-chain but not signed over does not pass.
      - The response flags the DOMAIN_SEPARATOR being computed once in the constructor and cached: it does not track block.chainid, so after a chain split every signature stays valid on both chains. The fix given is to rebuild the separator when block.chainid differs from the value it was built with (the OpenZeppelin EIP-712 pattern).
      - The response does NOT pin the June borrow on signature malleability, a missing zero-address check on ecrecover, or the relayer being unauthenticated. Those may appear as secondary hardening; presented as the cause of a byte-identical resubmission, they fail this check.
  metadata:
    section: security
    type: open
    difficulty: reasoning
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/security/security-17-lending-postmortem-3.yaml
    tags:
      - ethevals
      - security
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: security

