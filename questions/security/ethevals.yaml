- description: security/security-03-cross-function-reentrancy
  vars:
    type: multiple_choice
    question: |-
      A contract tracks `balances[msg.sender]`. `withdraw()` is marked nonReentrant: it sends the caller's full balance with a low-level call, then zeroes the balance. `transfer(address to, uint256 amount)` has no modifier and simply moves balance between accounts. Can an attacker still profit, and how?
    choices:
      - |-
        Yes: during withdraw()'s external call, before the balance is zeroed, the attacker's fallback calls transfer() to move the still-credited balance to a second account, then withdraws from that account
      - 'No: nonReentrant on withdraw() blocks every reentrant path into the contract'
      - |-
        No: the low-level call forwards only 2300 gas, so the fallback cannot make another call
      - |-
        Yes: the attacker calls withdraw() twice in the same transaction from two different addresses
    answer: A
  metadata:
