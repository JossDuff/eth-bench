- description: security/security-02-read-only-reentrancy
  vars:
    type: multiple_choice
    question: |-
      A liquidity pool lets users remove liquidity; during removal it sends ETH to the user with a low-level call and only afterwards updates its internal reserves. A separate lending protocol prices the pool's LP token by calling the pool's public view function `getVirtualPrice()`, which reads those reserves. The pool's own state-changing functions are all guarded with nonReentrant and the pool is never drained. Yet the lending protocol is exploited. What happened?
    choices:
      - |-
        The attacker reentered the pool's removeLiquidity through the ETH callback and withdrew twice
      - The lending protocol's nonReentrant modifier was missing on borrow()
      - |-
        During the ETH callback the pool's reserves were already reduced but the LP supply was not yet updated (or vice versa), so getVirtualPrice() returned a manipulated value; the attacker called the lending protocol from inside the callback, and its view-based pricing accepted the stale state
      - The pool's view function was not marked payable
    answer: C
  metadata:
    section: security
    type: multiple_choice
    difficulty: understanding
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/security/security-02-read-only-reentrancy.yaml
