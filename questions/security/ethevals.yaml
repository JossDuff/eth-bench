- description: security/security-04-vault-inflation
  vars:
    type: open
    question: |-
      Our USDC vault went live on Ethereum mainnet last night and a depositor has
      lost their money. Support has the on-chain sequence from the explorer:

        09:12  0xA1..  deposit(1)              — one unit, i.e. 0.000001 USDC
        09:12  0xA1..  receives 1 share        — vault share supply is now 1
        09:13  0xA1..  ERC-20 transfer of 20,000 USDC straight to the vault address
                       (a plain token transfer, not a call into our contract)
        09:41  0xB2..  deposit(15,000 USDC)    — transaction SUCCEEDS
        09:41  0xB2..  receives 0 shares
        09:44  0xA1..  redeems its 1 share     — receives 35,000.000001 USDC

      0xB2's transaction did not revert. The USDC left their wallet, the vault
      holds it, and their share balance reads zero. 0xA1 walked away with all of
      it and the vault is now empty.

      How the vault mints: a deposit mints
      `assets * totalShares / (USDC the vault currently holds)`, and when the share
      supply is zero the first depositor gets one share per unit deposited.
      Redeeming burns shares and pays out the same pro-rata slice. Nothing else in
      the contract touched the balances — no admin function ran, and the vault made
      no external calls other than the USDC transfers themselves.

      Explain exactly how 0xB2 ended up with zero shares while their deposit
      succeeded, whether this is a bug in our contract or a mistake by the
      depositor, and what change we ship so it cannot happen again. We want to stay
      ERC-4626 compatible.
    answer: |-
      Grade CORRECT only if the response satisfies every one of these points; a response that misses any of them is INCORRECT:
      - The response diagnoses the mechanism: the 20,000 USDC sent directly to the vault raised the vault's asset balance without minting any shares, so with a share supply of 1 the next depositor's share amount, computed as assets * totalShares / vaultAssets, rounded DOWN to zero — 15,000 USDC bought less than one whole share — and their assets were absorbed by the single share the first depositor held. Describing that truncation as a rounding-to-zero bug is part of the correct answer, not a miss. It FAILS only if the loss is pinned on something else: the depositor, a USDC transfer fee, a paused or blocklisted token, reentrancy, or an arithmetic typo unrelated to the direct transfer.
      - It calls this a bug in the vault (a first-depositor / donation share-price manipulation that any attacker can reproduce), not acceptable behavior and not a user error.
      - The prescribed fix is structural — it makes the manipulation uneconomical or impossible rather than only protecting one transaction. Any of these passes: a virtual shares-and-assets offset in the conversion math, adopting OpenZeppelin's ERC4626 (whose conversion carries virtual assets and shares by default; raising _decimalsOffset on top is a strengthening, not a requirement), seeding the vault with a dead first deposit whose shares are burned to a non-recoverable address, or tracking deposited assets in internal accounting instead of reading the raw token balance.
      - It does NOT prescribe as the fix: preventing or blocking direct ERC-20 transfers to the vault (impossible for a plain token transfer), sweeping donations to the owner, or a minimum-shares-out / slippage check on deposit alone. A minimum-shares-out check may be mentioned as an extra guard for depositors, but on its own it only makes the victim's transaction revert and leaves the vault manipulable.
  metadata:
    section: security
    type: open
    difficulty: reasoning
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/security/security-04-vault-inflation.yaml
    tags:
      - ethevals
      - security
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: security

- description: security/security-05-spot-price-oracle
  vars:
    type: open
    question: |-
      Design review on our lending market. Positions are up to $2M of WETH
      collateral backing USDC debt, liquidated at 85% LTV, on Ethereum mainnet.

      A teammate has written up how we should price the collateral:

        "Read it straight from the Uniswap V3 WETH/USDC 0.05% pool with slot0. That
        pool holds around $200M of liquidity. To move its price 10% an attacker
        would have to push tens of millions of dollars through it, and arbitrage
        bots would drag it back within the same block, so they would eat the loss
        for nothing. Chainlink is an extra external call, its answer can be stale
        between updates, and it puts a third party between us and our own
        liquidations. Our own on-chain reserve of truth is strictly better."

      Work the numbers rather than trading opinions: what does it actually cost an
      attacker to make our contract read a price 10% away from the market price at
      the moment our contract reads it, and what do they get for it? Then tell me
      what we should price collateral with, and what has to be checked around that
      price before we use it in a health calculation.
    answer: |-
      Grade CORRECT only if the response satisfies every one of these points; a response that misses any of them is INCORRECT:
      - The response rejects the teammate's cost argument with the atomicity reasoning: the capital needed to move the pool is borrowed and repaid inside the SAME transaction (a flash loan), so the tens of millions is never at risk and the attacker's true cost is only pool fees plus slippage on the round trip — and arbitrage cannot help because the manipulated read, the borrow or liquidation it enables, and the unwind all complete before any other transaction can run.
      - It concludes that a Uniswap V3 slot0 spot read (or any single-block spot price: getReserves, a balance ratio, an on-the-spot quoter call) must NOT be the price source for these health calculations, regardless of how deep the pool is.
      - It prescribes a manipulation-resistant source instead. A Chainlink or equivalent push feed as the primary liquidation price passes. A Uniswap V3 TWAP also passes only when averaged over a meaningful window on the order of 30 minutes or more and presented as a weaker fallback or secondary sanity check, not as equivalent to a push feed for liquidation-grade decisions. It need not prescribe both sources.
      - It requires both validations before a push-feed answer enters the health calculation: the answer is positive, and updatedAt is no older than a configured per-feed maximum age chosen from that feed's published update interval or heartbeat (a tighter justified bound also passes). A bare latestAnswer(), an unchecked latestRoundData(), or one global timeout asserted to fit every feed fails.
      - It does NOT settle for keeping the spot read plus a patch — a deviation threshold or circuit breaker on the spot price, a median across several pools' spot prices, or moving to a bigger pool — as the primary fix.
  metadata:
    section: security
    type: open
    difficulty: reasoning
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/security/security-05-spot-price-oracle.yaml
    tags:
      - ethevals
      - security
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: security

- description: security/security-06-fee-on-transfer-books
  vars:
    type: open
    question: |-
      Our single-token staking pool on Ethereum mainnet has been live for three
      weeks and the books do not close. What we can see:

        - 1,250,000 TKN has been staked cumulatively since launch, and 250,000 TKN
          has been unstaked
        - summing stakedBalance[user] across every current staker: 1,000,000 TKN
        - the pool contract's actual TKN balance: 975,000 TKN
        - the early unstakers were all paid without the pool reverting; the ones
          unstaking now are starting to revert with the token's insufficient-balance
          error
        - one user staked 10,000 TKN, the UI showed 10,000 staked, and when they
          unstaked all 10,000 their wallet received 9,800 TKN

      What the contract does, in full: `stake(amount)` calls
      `token.transferFrom(msg.sender, address(this), amount)` and then sets
      `stakedBalance[msg.sender] += amount`. `unstake(amount)` decrements
      `stakedBalance[msg.sender]` and then calls `token.transfer(msg.sender,
      amount)`. There is no rewards logic yet, no admin withdrawal function, and
      the pool has never sent TKN anywhere except back to unstakers. TKN's total
      supply has not been changed by anyone and no rebase has occurred.

      Explain where the missing 25,000 TKN went and why the shortfall grows, then
      give the change that makes the accounting correct — including what happens to
      the stakers who cannot currently unstake.
    answer: |-
      Grade CORRECT only if the response satisfies every one of these points; a response that misses any of them is INCORRECT:
      - The response identifies that TKN takes a cut on every transfer (a fee-on-transfer / transfer-tax / deflationary token), so the pool receives LESS than the amount argument it credits — the derivation the numbers support is roughly 2% (10,000 unstaked vs 9,800 delivered; a 25,000 shortfall against 1,250,000 cumulatively staked). It does NOT explain the gap as a rebase, an admin drain, a reentrancy exploit, integer rounding, or a mistake by users.
      - It explains why the shortfall is progressive and lands on the last unstakers: every stake over-credits by the fee while the pool is debited the full requested amount on the way out, so the deficit accumulates and the pool runs out of tokens before the last balances are paid.
      - The fix credits what was actually received rather than what was requested: measure token.balanceOf(address(this)) immediately before and after transferFrom and credit the difference. Explicitly rejecting such tokens up front by reverting when the received delta mismatches the requested amount is equally acceptable. On withdrawal, debiting the requested amount already matches what leaves the pool even when the recipient receives less; the answer may either accept that token-level exit fee or measure it for user-facing guarantees, but it need not apply a second balance-delta credit mechanism. It FAILS if the prescribed fix is a hardcoded fee percentage or buffer, topping the pool up from treasury as the fix itself, or asking users to send extra.
      - It addresses the already-stuck stakers concretely (for example: socialize the shortfall pro-rata over remaining balances, or fund the gap and migrate to the corrected accounting) rather than leaving them unmentioned.
  metadata:
    section: security
    type: open
    difficulty: reasoning
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/security/security-06-fee-on-transfer-books.yaml
    tags:
      - ethevals
      - security
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: security

- description: security/security-07-oz-v5-approvals
  vars:
    type: open
    question: |-
      Our treasury router on Ethereum mainnet pulls stablecoins in and forwards
      them to a strategy contract, which it has to approve before each run. The
      repo is on @openzeppelin/contracts v5 and Solidity 0.8.26.

      The approval step is a low-level call, because an earlier version reverted
      while decoding the return value of some tokens:

        (bool ok, ) = token.call(abi.encodeWithSelector(0x095ea7b3, strategy, amount));
        require(ok, "approve failed");

      Three weeks of runs:

        - USDC (0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48): every run succeeds
        - USDT (0xdAC17F958D2ee523a2206206994597C13D831ec7): the FIRST run
          succeeded. Every run since reverts, always at that require, before any
          transfer happens
        - the strategy frequently spends less than it was approved for, so a
          leftover allowance from the previous run is normally still sitting there
        - the router holds enough ETH for gas, is not paused, is not on any
          blocklist, and the amounts are ordinary five-figure sums

      Why does this fail only for USDT, and only after the first run? Give the
      minimal change to the router that fixes it, and say what it should do about
      the leftover allowance in general.
    answer: |-
      Grade CORRECT only if the response satisfies every one of these points; a response that misses any of them is INCORRECT:
      - The response diagnoses the token-side guard: USDT's approve reverts when it is called to set a NON-ZERO allowance while a non-zero allowance from before is still outstanding (the anti-front-running approve-race check in its implementation), which is exactly why the first run — with a zero starting allowance — worked, why the later runs fail, and why USDC, which has no such restriction, is unaffected. It does NOT attribute the failure to gas, a paused or blocklisted token, the missing return value (already handled by the low-level call), an allowance overflow, or the strategy contract.
      - The prescribed fix goes through a path that zeroes the allowance before setting a new non-zero one. Any of these passes: SafeERC20.forceApprove, SafeERC20.safeIncreaseAllowance or safeDecreaseAllowance (OpenZeppelin v5 routes both through forceApprove), or an explicit approve(0) followed by approve(amount). It FAILS if it prescribes safeApprove: that function was removed in OpenZeppelin Contracts v5, which the repo is pinned to, so the suggested code would not compile.
  metadata:
    section: security
    type: open
    difficulty: reasoning
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/security/security-07-oz-v5-approvals.yaml
    tags:
      - ethevals
      - security
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: security

- description: security/security-08-signature-replay
  vars:
    type: open
    question: |-
      Post-mortem needed on our gasless order relayer. Users sign an order
      off-chain — (owner, token, amount, nonce, deadline) — and our relayer submits
      it on their behalf; the contract recovers the signer, checks the nonce has
      not been used, checks the deadline, marks the nonce used and moves the tokens.

      We ship the same contract to every chain we support and deploy it with
      CREATE2 from the same factory and salt, so it sits at the identical address
      on Ethereum mainnet, Base and Arbitrum. Users like that: one address to
      remember.

      What happened: a user signed one order for 5,000 USDC. Our relayer executed
      it on Base at 14:02 — correct, that was the order. At 14:07 someone else
      submitted the exact same signature to the mainnet deployment and it executed
      there too, moving another 5,000 USDC of the user's mainnet balance. The user
      signed once. They were charged twice.

      Both executions passed every check the contract makes. On mainnet the
      recovered signer was the owner, the nonce had never been used, and the
      deadline had not passed.

      How we build the digest: `keccak256(abi.encodePacked("\x19\x01",
      DOMAIN_SEPARATOR, structHash))`, where DOMAIN_SEPARATOR is computed once in
      the constructor from the contract name, a version string, and address(this),
      and stored in an immutable.

      Explain why the mainnet deployment accepted a signature the user produced for
      Base, and what has to change so one signature can only ever be valid on the
      chain it was meant for. We want to keep the same address on every chain.
    answer: |-
      Grade CORRECT only if the response satisfies every one of these points; a response that misses any of them is INCORRECT:
      - The response pinpoints the domain separator: it is built from name, version and contract address only, with no chain identifier — and because the deployments share an address via CREATE2, every input to the digest is byte-identical on Base and mainnet, so the same signature recovers the same signer on both. It does NOT blame the relayer, the signature-recovery code, malleability, or the deadline.
      - It explains why the nonce could not stop this: nonce state is per-deployment storage, so the mainnet contract has never seen that nonce and has no way to learn that Base consumed it — replay protection within a chain is not replay protection across chains.
      - The fix binds the signature to one chain while keeping the shared address. The standard form passes: chain id in the EIP-712 domain — EIP712Domain(string name,string version,uint256 chainId,address verifyingContract) — so the digest differs per chain, and delegating that to OpenZeppelin's EIP712 helper counts. Binding the chain id inside the signed order struct and enforcing it against block.chainid on execution also passes; it is a weaker convention but it does stop the replay.
      - If it caches the domain separator, it accounts for block.chainid changing after deployment (a chain fork) by re-deriving the separator when the current chain id differs from the one cached at construction, rather than trusting an immutable forever. Using OpenZeppelin's EIP712, which does this internally, counts as a pass.
      - It does NOT present per-chain deployment addresses (different salts per chain) or a shorter deadline as the fix — the requirement to keep one address on every chain stands.
  metadata:
    section: security
    type: open
    difficulty: reasoning
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/security/security-08-signature-replay.yaml
    tags:
      - ethevals
      - security
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: security

- description: security/security-09-uups-upgrade
  vars:
    type: open
    question: |-
      Post-mortem on our staking protocol — a UUPS-upgradeable contract on Ethereum
      mainnet. We upgraded the implementation from V1 to V2 yesterday. The upgrade
      transaction succeeded, the proxy now points at V2, and every function call
      still executes without reverting — but the values coming back are wrong.

      V1 declared its state, in this order:

        uint256 public totalDeposited;  // held 2,000,000 USDC = 2_000_000_000000 base units
        address public treasury;        // held 0xC0FFEE0000000000000000000000000000000000
        uint256 public feeBps;          // held 500

      V2 is V1 plus one feature — a reward index. The new source declares, in order:

        uint256 public rewardIndex;     // new in V2
        uint256 public totalDeposited;
        address public treasury;
        uint256 public feeBps;

      We added no re-initializer, and the upgrade never rewrote any existing value.

      Since the upgrade, reading the proxy returns:

        rewardIndex()    -> 2000000000000        (we have never set this)
        totalDeposited() -> a huge number that, printed in hex, is exactly our
                            old treasury address
        treasury()       -> 0x00000000000000000000000000000000000001F4
        feeBps()         -> 0

      The proxy admin is unchanged, the implementation address is the V2 we
      deployed, and no call reverts. Explain why every value reads shifted like
      this, whether our deposit data is gone, and what we change so the V2 upgrade
      is safe — we still need rewardIndex in V2.
    answer: |-
      Grade CORRECT only if the response satisfies every one of these points; a response that misses any of them is INCORRECT:
      - The response diagnoses a storage-layout collision caused by inserting a new variable ahead of the existing ones: because the proxy keeps V1's storage and V2 assigns slots by declaration order, putting rewardIndex first shifted every existing variable down one slot, so each getter now reads its former neighbour's slot — rewardIndex reads slot 0 (old totalDeposited, 2,000,000 USDC = 2000000000000), totalDeposited reads slot 1 (the old treasury address, which is why it prints as a huge number equal to that address in hex), treasury reads slot 2 (old feeBps 500 = 0x1F4), and feeBps reads the never-written slot 3 (0). It does NOT pin the cause on a missing or failed initializer, a bad re-initializer value, the wrong implementation address, a proxy-admin misconfiguration, or data lost/corrupted during the upgrade.
      - It states the rule the upgrade broke: an upgradeable contract's storage layout is append-only — new state variables may only be added AFTER all existing ones, never inserted before them or reordered — because the proxy preserves storage across upgrades and slots are fixed by declaration order.
      - It concludes the deposit data is NOT lost: the original values still sit untouched in their original slots (0, 1, 2) and are only being read through a mismatched layout, so no funds or state were destroyed. It FAILS if it declares the deposits unrecoverable, or if its primary remedy is migrating to a brand-new proxy.
      - The fix restores the V1 slot order and appends the new variable: declare rewardIndex AFTER feeBps (preserving slots 0-2 for totalDeposited/treasury/feeBps) and ship that as the corrected implementation, which makes every read correct again because the physical slots never moved. It FAILS if the fix reorders or inserts again, or if the primary remedy is manually overwriting each variable. Naming storage gaps or ERC-7201 namespaced storage (or an OZ storage-layout / upgrade-safety check) as forward-looking prevention is a plus, not a substitute for the append-ordered fix.
  metadata:
    section: security
    type: open
    difficulty: reasoning
    source: |-
      https://github.com/austintgriffith/ethevals/blob/main/evals/security/security-09-uups-upgrade.yaml
    tags:
      - ethevals
      - security
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: security

