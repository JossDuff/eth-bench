- description: security/security-12-storage-layout
  vars:
    type: multiple_choice
    question: |-
      A contract behind an upgradeable proxy declared, in V1, exactly two storage variables in this order: `uint256 a; uint256 b;`. You are writing V2 and need to add a new variable `uint256 c`. Which V2 storage layout is safe?
    choices:
      - Any order is safe because variable names are preserved across upgrades
      - uint256 a; uint256 b; uint256 c;
      - uint256 c; uint256 a; uint256 b;
      - uint256 a; uint256 c; uint256 b;
