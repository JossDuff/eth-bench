- id: contract-reading-k-01
  type: multiple_choice
  question: |
    Read this complete Solidity contract:

    ```solidity
    pragma solidity ^0.8.20;

    contract Sale {
        address public immutable seller;
        uint256 public immutable startPrice;
        uint256 public immutable startAt;
        uint256 public immutable discountPerSecond;
        address public buyer;

        constructor(uint256 _startPrice, uint256 _discountPerSecond) {
            seller = msg.sender;
            startPrice = _startPrice;
            startAt = block.timestamp;
            discountPerSecond = _discountPerSecond;
        }

        function price() public view returns (uint256) {
            return startPrice - discountPerSecond * (block.timestamp - startAt);
        }

        function buy() external payable {
            require(buyer == address(0), "sold");
            uint256 p = price();
            require(msg.value >= p, "underpaid");
            buyer = msg.sender;
            payable(seller).transfer(p);
            if (msg.value > p) payable(msg.sender).transfer(msg.value - p);
        }
    }
    ```

    What kind of sale mechanism is this?
  choices:
  - English auction — bidders submit ascending bids until a deadline
  - Dutch auction — the price falls over time and the first buyer to accept it wins
  - Fixed-price sale — the price never changes
  - Sealed-bid auction — bids are hidden until a reveal phase
  answer: B
  difficulty: understanding
  source: |-
    https://github.com/clawdbotatg/eth-evals/blob/main/tasks/skill-contract-reading.jsonl
  tags:
  - eth-evals
  - contract-reading
