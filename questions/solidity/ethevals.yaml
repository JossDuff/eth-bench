- id: concepts-12-blockhash-current
  type: open
  question: |
    Inside a Solidity contract, a developer writes `blockhash(block.number)` hoping to get the hash of the current block. What value does this expression always return?
    End your reply with a line of the form "Answer: <value>".
  answer: |
    Any of the following counts as correct: The response's final answer must be exactly `zero` (case-insensitive). OR The response's final answer must be exactly `0` (case-insensitive). OR The response's final answer must be the integer 0 (decimal or the equivalent hex). OR The response's answer must match the pattern `^(0|0x0+)\b|bytes32\(0\)|zero` (that is, it must name the concept the pattern captures)..
  difficulty: recall
  source: |-
