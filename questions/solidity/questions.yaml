- description: solidity/solidity-super-call-order
  vars:
    type: open
    question: |-
      Contract A declares `function f() public virtual`. Contracts B and C each
      inherit A, override f, and call `super.f()` in their body. Contract D is
      declared `contract D is B, C`, overrides f, and calls `super.f()`. When
      `D.f()` is called, in what order do the four bodies run, and what rule
      determines it?
    answer: |-
      D's body runs first, then C's, then B's, then A's. Solidity uses C3
      linearization, and in the `is` list the bases are written from "most
      base-like" to "most derived", so the right-most base, C, is the nearest
      ancestor. `super` follows that linearization: D's super is C, C's super is
      B, and B's super is A, even though B and C each declared only A as a
      parent. A complete answer must give the order D, C, B, A and attribute it to
      the linearization order, with the right-most base in the `is` list being
      called first.
  metadata:
    section: solidity
    type: open
    difficulty: reasoning
    source: |-
      https://docs.soliditylang.org/en/latest/contracts.html#multiple-inheritance-and-linearization
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: solidity

- description: solidity/solidity-custom-errors-revert-data
  vars:
    type: open
    question: |-
      What revert data does `require(ok, "not owner")` produce, what does a custom
      error such as `revert NotOwner(msg.sender)` produce, and why are custom
      errors cheaper?
    answer: |-
      A require with a string reverts with the ABI encoding of `Error(string)`:
      the selector 0x08c379a0 followed by the ABI-encoded string. A custom error
      reverts with its own 4-byte selector, the keccak256 of its signature
      (`NotOwner(address)`), followed by the ABI-encoded arguments. Custom errors
      are cheaper because the revert string does not have to be stored in the
      deployed bytecode (lower deployment cost) and the revert data is a few words
      instead of an encoded string (lower runtime cost), while still carrying
      structured information the caller can decode. A complete answer must say
      require strings encode as Error(string) and custom errors as their own
      selector plus arguments, and give bytecode size or revert-data size as the
      saving.
  metadata:
    section: solidity
    type: open
    difficulty: understanding
    source: |-
      https://docs.soliditylang.org/en/latest/contracts.html#errors-and-the-revert-statement
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: solidity

