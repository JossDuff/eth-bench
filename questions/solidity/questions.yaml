- description: solidity/solidity-abi-array-element-offset-origin
  vars:
    type: open
    question: |-
      Using Solidity 0.8.24's standard ABI encoder, let `items` be a memory
      `string[]` containing ["a", "bc"]. Consider `abi.encode(uint256(7), items)`,
      without any function selector prefix.

      What integer values occupy the 32-byte words starting at byte offsets
      0x60 and 0x80 of the encoded output, and from which byte position in the
      output are those two offsets measured?
    answer: |-
      The word at 0x60 contains 0x40 (64), and the word at 0x80 contains
      0x80 (128). Both offsets are measured from byte position 0x60, the start
      of the array's element-head tuple immediately after its length word.
      They therefore point to string encodings beginning at 0xa0 and 0xe0.
      A complete answer must give both offset values and identify 0x60 as their
      common origin. Giving the absolute target positions is optional.
  metadata:
    section: solidity
    type: open
    difficulty: reasoning
    source: |-
      https://docs.soliditylang.org/en/v0.8.24/abi-spec.html#formal-specification-of-the-encoding
  assert:
