- id: solidity-uint8-overflow-0-8
  type: multiple_choice
  question: |
    In Solidity 0.8.x, what happens when this function is called?

        function f() external pure returns (uint8) {
            uint8 x = 255;
            x++;
            return x;
        }
  choices:
    - It reverts with a Panic error, code 0x11 (arithmetic overflow)
    - It returns 0; the increment wraps around
    - It fails to compile because the overflow is detectable at compile time
    - It returns 255; the increment is silently ignored
  answer: A
  difficulty: recall
  source: https://docs.soliditylang.org/en/latest/control-structures.html#checked-or-unchecked-arithmetic

