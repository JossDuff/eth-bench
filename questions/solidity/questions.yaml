- description: solidity/solidity-calldata-vs-memory-param
  vars:
    type: open
    question: |-
      An external Solidity function takes a uint256[] parameter. What is the
      difference between declaring it as `calldata` and as `memory`, and when
      would you choose each?
    answer: |-
      With `calldata` the array is read directly from the transaction's calldata:
      nothing is copied, so the call costs no memory-expansion gas proportional to
      the array's length, but the data is read-only and cannot be modified. With
      `memory` the ABI decoder copies the array into memory first, which costs gas
      that grows with the array's length, but the function can then modify it.
      Choose `calldata` for parameters that are only read or passed along (it is
      also the only option that supports slicing, `arr[i:j]`); choose `memory`
      when the function needs to mutate the array. A complete answer must say
      `calldata` avoids the copy and is read-only, and `memory` copies and is
      mutable.
  metadata:
    section: solidity
    type: open
    difficulty: understanding
    source: https://docs.soliditylang.org/en/latest/types.html#data-location
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: solidity

- description: solidity/solidity-reentrancy-in-withdraw
  vars:
    type: open
    question: |-
      This function is part of a contract compiled with Solidity 0.8.20. What is
      wrong with it, how would an attacker exploit it, and how should it be fixed?

          mapping(address => uint256) public balances;

          function withdraw() external {
              uint256 amount = balances[msg.sender];
              (bool ok, ) = msg.sender.call{value: amount}("");
              require(ok, "transfer failed");
              balances[msg.sender] = 0;
          }
    answer: |-
      It is vulnerable to reentrancy. The ETH is sent with a low-level call before
      the caller's balance is zeroed, and `call` forwards all remaining gas, so a
      contract at msg.sender can, in its receive or fallback function, call
      withdraw again while balances[msg.sender] still holds the original amount,
      repeating until the contract is drained. Solidity 0.8's checked arithmetic
      does not help because no arithmetic overflows. The fix is to follow
      checks-effects-interactions: set balances[msg.sender] = 0 before making the
      external call (or use a reentrancy guard such as OpenZeppelin's
      nonReentrant). A complete answer must identify reentrancy through the
      external call happening before the state update, and give the fix of
      updating state first or adding a reentrancy guard.
  metadata:
    section: solidity
    type: open
    difficulty: reasoning
    source: https://docs.soliditylang.org/en/latest/security-considerations.html#reentrancy
  assert:
    - type: llm-rubric
      value: '{{answer}}'
      metric: solidity

