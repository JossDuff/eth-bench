- id: solidity-try-catch-return-decoding-boundary
  type: open
  question: |-
    Consider this Solidity 0.8.24 code:

    interface Target {
        function value() external returns (uint256);
    }

    contract Reader {
        function read(address target) external returns (uint256) {
            try Target(target).value() returns (uint256 v) {
                return v;
            } catch {
                return 99;
            }
        }
    }

    The target is a deployed contract whose fallback accepts this call and
    successfully returns zero bytes. Does `read` return 99, or does it revert?
    Explain the relevant boundary of Solidity's try/catch handling.
  answer: |-
    The read call reverts; it does not return 99. Although the external call
    succeeds, decoding its empty return data as uint256 fails in the caller.
    A return-data decoding error in this situation is not caught by the
    catch clauses attached to that external call.
    A complete answer must state that read reverts and that caller-side
    return-data decoding failure is outside this try/catch's handling.
  difficulty: understanding
  source: https://docs.soliditylang.org/en/v0.8.24/control-structures.html#try-catch
- id: solidity-memory-alias-rebinding
  type: open
  question: |-
    In Solidity 0.8.24, what pair does this function return, and why?

    function probe() external pure returns (uint256, uint256) {
        uint256[] memory a = new uint256[](1);
        a[0] = 3;
        uint256[] memory b = a;
        b[0] = 9;
        b = new uint256[](1);
        b[0] = 7;
        return (a[0], b[0]);
    }
  answer: |-
    The function returns (9, 7). The initial memory-to-memory assignment makes
    b refer to the same array as a, so writing 9 through b changes that array.
    Assigning a newly allocated array to b subsequently rebinds b without
    changing a's reference.
    A complete answer must give (9, 7) and explain both the initial aliasing
    and the later rebinding rather than a copy of the original array.
  difficulty: reasoning
  source: |-
    https://docs.soliditylang.org/en/v0.8.24/types.html#data-location-and-assignment-behaviour
