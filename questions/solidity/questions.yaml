- id: solidity-encodepacked-collision
  type: open
  question: |
    A contract computes `keccak256(abi.encodePacked(a, b))` where `a` and `b`
    are both `string` parameters supplied by the caller, and uses the hash as a
    unique key. Why is this unsafe, and what should be used instead?
  answer: |
    `abi.encodePacked` concatenates dynamic types without padding or length
    prefixes, so different pairs of inputs can produce identical bytes: ("a",
    "bc") and ("ab", "c") both pack to "abc" and hash to the same key. A caller
    can therefore forge a collision with another user's key. Use `abi.encode`,
    which length-prefixes and pads every argument so the encoding is unambiguous,
    or ensure at most one argument is dynamic (the compiler warns when two or
    more are). A complete answer must explain that packed encoding of two dynamic
    values is ambiguous, leading to hash collisions, and name `abi.encode` as the
    fix.
  difficulty: reasoning
  source: https://docs.soliditylang.org/en/latest/abi-spec.html#non-standard-packed-mode

