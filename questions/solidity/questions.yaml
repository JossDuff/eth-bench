    and where do their values live once the contract is deployed?
  choices:
    - A constant must be a compile-time expression and is inlined at each use; an immutable may be assigned once, in the constructor or at declaration, and its value is written into the deployed bytecode. Neither reads storage.
    - Both are stored in storage slots but marked read-only by the compiler
    - A constant may be assigned in the constructor; an immutable must be fixed at compile time
    - An immutable is stored in storage and a constant in memory
  answer: A
  difficulty: understanding
  source: https://docs.soliditylang.org/en/latest/contracts.html#constant-and-immutable-state-variables

