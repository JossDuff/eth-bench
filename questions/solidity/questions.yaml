- id: solidity-signed-shift-division-rounding
  type: open
  question: |-
    In Solidity 0.8.24, what pair does this function return? Explain why
    its two expressions do or do not produce the same value.

    function rounding() external pure returns (int256, int256) {
        int256 x = -5;
        return (x >> 1, x / 2);
    }
  answer: |-
    The function returns (-3, -2). Signed right shift is an arithmetic shift
    and corresponds here to division by two rounded toward negative infinity.
    Signed integer division rounds toward zero.
    A complete answer must give both values and distinguish the rounding
    behavior of signed right shift from signed division.
  difficulty: reasoning
  source: https://docs.soliditylang.org/en/v0.8.24/types.html#integers
- id: solidity-constructor-virtual-dispatch
  type: multiple_choice
  question: |-
    The following contracts are compiled with Solidity 0.8.24:

    contract A {
        uint256 public x;

        constructor() {
            x = f();
        }

        function f() internal pure virtual returns (uint256) {
            return 1;
        }
    }

    contract B is A {
        function f() internal pure override returns (uint256) {
            return 2;
        }
    }

    After successfully deploying B, what does its x() getter return?
  choices:
  - 0, because B's implementation is unavailable while A's constructor runs.
  - |-
    1, because virtual calls in a base constructor resolve to the base implementation.
  - 2, because the call resolves to the most-derived override.
  - Deployment fails because constructors cannot call virtual functions.
  answer: C
  difficulty: understanding
  source: https://docs.soliditylang.org/en/v0.8.24/contracts.html#constructors
